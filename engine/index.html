<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun for Nordic</title>
<script>
/* Los alumnos no deben ver github.io en la barra: si esta copia se abre desde
   GitHub Pages (enlaces/marcadores viejos), salta a nis.cohasset.pe
   conservando ruta, query y hash. En nis.cohasset.pe es un no-op. */
if(/\.github\.io$/i.test(location.hostname)){
  location.replace('https://nis.cohasset.pe'+location.pathname+location.search+location.hash);
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#f6f9fb; --surface:#fff; --surface2:#eef3f7; --ink:#1b2b3d; --soft:#4a5d70;
    --line:#d7e1e9; --accent:#3b6fb5; --ok:#2f9268; --bad:#cc4b3d; --star:#e0a91f;
  }
  *{box-sizing:border-box}
  html{min-width:0;overflow-x:hidden}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:1.04rem;line-height:1.5}
  main{max-width:64rem;margin:0 auto;padding:1rem 1rem 5rem}
  .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;
    margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;
    white-space:nowrap!important;border:0!important}
  .app-loading{min-height:70vh;display:grid;place-items:center;text-align:center;color:var(--soft)}
  .app-loading span{display:block;width:2.4rem;height:2.4rem;margin:0 auto .8rem;
    border:.3rem solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:loading-spin .8s linear infinite}
  .app-loading strong{display:block;font-family:"Baloo 2";font-size:1.15rem;color:var(--ink)}
  @keyframes loading-spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.app-loading span{animation:none;border-top-color:var(--line)}}

  /* ---------- navegacion pantalla a pantalla ---------- */
  .scr{position:relative;min-height:calc(100vh - 3rem);display:flex;flex-direction:column;
    align-items:center;padding:0 3.6rem}
  /* el padding reserva el sitio de las dos salidas: sin el, un titulo largo
     se mete debajo de la pildora del portal */
  .scr-top{width:100%;display:flex;align-items:center;justify-content:center;gap:1rem;
    margin:.4rem 0 1rem;position:relative;padding:0 9rem}
  .scr-tit{font-family:"Baloo 2",sans-serif;font-size:1.35rem;margin:0;text-align:center;color:var(--accent)}
  .scr-cuenta{position:absolute;right:.2rem;top:2.3rem;font-size:.82rem;color:var(--soft)}
  /* las dos salidas de la barra: subir un escalon (izquierda) y salir al
     portal (derecha). El contador baja un poco para dejarles sitio. */
  .scr-salir,.scr-portal{position:absolute;top:0;display:inline-flex;align-items:center;gap:.3rem;
    font-weight:700;font-size:.88rem;text-decoration:none;color:var(--accent);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;
    padding:.32rem .85rem;white-space:nowrap}
  .scr-salir{left:0}
  .scr-portal{right:0}
  .scr-salir:hover,.scr-portal:hover{border-color:var(--accent)}
  /* en pantalla estrecha se quedan solo los iconos: el titulo necesita ancho */
  @media (max-width:640px){
    .scr-salir span,.scr-portal span{display:none}
    .scr-salir,.scr-portal{padding:.32rem .6rem}
    .scr-top{padding:0 3.2rem}
    .scr-tit{font-size:1.08rem;line-height:1.2}
  }
  /* todo el contenido va centrado, no pegado a la izquierda */
  .scr-body{width:100%;flex:1;display:flex;justify-content:center}
  /* el cuerpo se queda con el alto libre y el contenido se centra en el.
     Con margin auto (y no justify-content) el que no cabe sigue pudiendo
     desplazarse: si no, se corta por arriba y no hay forma de subir. */
  .scr-body{min-height:calc(100vh - 13rem);display:flex;flex-direction:column}
  .scr-body > *{margin-block:auto}
  .scr-centro{width:100%;max-width:52rem;display:flex;flex-direction:column;
    align-items:center;gap:1rem;text-align:center}
  .scr-centro > *{width:100%}
  .scr-centro .op-text{text-align:left}
  .scr-centro .units{text-align:left}
  .scr-pie{color:var(--soft)}
  /* la estanteria de cuentos del nivel */
  .cuentos{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.9rem}
  .cuento{background:var(--surface);border:1px solid var(--line);border-radius:16px;
    overflow:hidden;text-decoration:none;color:inherit;display:block;transition:transform .16s}
  .cuento:hover{transform:translateY(-4px)}
  .cuento img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block}
  .cuento b{display:block;padding:.6rem .8rem 0;font-family:"Baloo 2",sans-serif;font-size:1rem}
  .cuento small{display:block;padding:0 .8rem .7rem;color:var(--soft)}
  /* lo que la secuencia del colegio espera de este grado */
  .sc-grado{margin-top:1.2rem;background:var(--surface2);border-radius:16px;
    padding:.9rem 1.1rem;text-align:left;max-width:44rem;margin-inline:auto}
  .sc-grado h4{margin:0 0 .2rem;font-family:"Baloo 2",sans-serif;color:var(--accent)}
  .sc-nota{margin:0 0 .5rem;color:var(--soft);font-size:.9rem}
  .sc-grado ul{margin:0;padding-left:1.1rem}
  .sc-grado li{margin:.25rem 0;line-height:1.5}
  /* palabras de ampliacion que pide la secuencia */
  .pw.pw-extra{position:relative}
  .pw.pw-extra::after{content:"+";position:absolute;top:.2rem;right:.35rem;
    background:var(--star);color:#3a2c05;border-radius:999px;width:1.1rem;height:1.1rem;
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.72rem}
  /* las palabras de la unidad, marcadas en la historia */
  mark.clave{background:#fff2c9;color:inherit;border-radius:5px;padding:0 .18rem;
    box-decoration-break:clone;-webkit-box-decoration-break:clone;font-weight:600}
  /* mando del audio: play, pausa y parar por separado */
  .lsn-mando{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem;
    justify-content:center}
  .lsn-mando button{background:var(--accent);color:#fff;border:0;border-radius:999px;
    padding:.42rem 1rem;font-family:"Baloo 2",sans-serif;font-weight:700;cursor:pointer}
  .lsn-mando button:disabled{background:var(--line);color:var(--soft);cursor:default}
  .provisional{color:var(--soft);font-size:.85rem}
  /* mientras esta corregido no se puede reescribir encima */
  input.bloqueado{background:var(--surface2);cursor:default}
  input.revelado{background:#eaf6f0;border-color:var(--ok);color:var(--ok);font-weight:700}
  .again{background:var(--star);color:#3a2c05}
  .reveal{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .tries{color:var(--soft);font-size:.9rem}
  /* la mascota presentando: su dibujo y un bocadillo que se puede oir */
  .guia{display:flex;align-items:center;gap:.8rem;text-align:left;max-width:46rem;
    margin-inline:auto;width:100%}
  .guia-mascota{height:74px;width:auto;flex:none}
  .guia-globo{position:relative;background:var(--surface2);border-radius:16px;
    padding:.7rem 1rem;flex:1}
  .guia-globo::before{content:"";position:absolute;left:-9px;top:50%;transform:translateY(-50%);
    border:9px solid transparent;border-right-color:var(--surface2)}
  .guia-globo p{margin:0 0 .4rem;line-height:1.5}
  .guia-say{background:var(--accent);color:#fff;border:0;border-radius:999px;
    padding:.3rem .8rem;font-family:"Baloo 2",sans-serif;font-weight:700;
    font-size:.9rem;cursor:pointer}
  .guia-say.saying{background:var(--ok)}
  .historia-say{margin-top:.6rem}
  @media (max-width:560px){
    .guia{flex-direction:column;text-align:center}
    .guia-globo::before{display:none}
  }
  /* la ficha de la mascota, debajo de su video */
  .ficha{display:flex;align-items:center;gap:1rem;text-align:left;
    background:var(--surface2);border-radius:16px;padding:.9rem 1.2rem;max-width:44rem;
    margin-inline:auto}
  .ficha img{height:96px;width:auto;flex:none}
  .ficha p{margin:0;line-height:1.55}
  /* quien es quien, debajo del video del elenco */
  .quienes{display:flex;flex-wrap:wrap;justify-content:center;gap:.6rem}
  .quien{background:var(--surface2);border:1px solid var(--line);border-radius:14px;
    padding:.5rem .7rem .4rem;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:.2rem;font-family:"Baloo 2",sans-serif;font-weight:700;
    color:var(--ink);transition:transform .15s}
  .quien img{height:74px;width:auto;display:block}
  .quien:hover{transform:translateY(-4px)}
  .quien.dice{animation:quiendice .5s ease-out}
  @keyframes quiendice{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  /* Las dos fotos de las diferencias llenaban la pantalla y dejaban la
     grabadora por debajo del pliegue: parecia que no estaba. Se les pone
     techo en funcion del alto de la ventana para que quepa todo junto. */
  .scr-centro .sd-img{max-height:34vh;object-fit:contain;background:var(--surface2)}
  .scr-centro .rphoto{max-height:38vh;width:auto;margin-inline:auto}
  .scr-video{width:100%;max-width:50rem;border-radius:14px;border:1px solid var(--line);display:block}
  .scr-escena{width:min(100%,70rem);border-radius:16px;border:1px solid var(--line);
    display:block;margin-inline:auto;box-shadow:0 8px 26px rgba(20,40,70,.14)}
  .band-grande{gap:1.4rem;text-align:left}
  .band-grande img{height:190px}

  /* flechas: la de avanzar, grande y a la derecha, como pidio el usuario */
  .scr-nav{position:fixed;top:50%;transform:translateY(-50%);z-index:5;
    background:var(--accent);color:#fff;border:0;border-radius:999px;
    padding:.7rem 1.1rem;display:flex;align-items:center;gap:.4rem;
    box-shadow:0 4px 16px rgba(59,111,181,.35);font-family:"Baloo 2",sans-serif;
    font-weight:700;font-size:1rem;cursor:pointer}
  .scr-next{right:.8rem}
  .scr-prev{left:.8rem;background:var(--surface2);color:var(--ink);box-shadow:none}
  .scr-nav:hover{filter:brightness(1.06)}
  .scr-nav[hidden]{display:none}
  .scr-fl{font-size:1.5rem;line-height:1}
  .scr-prev .scr-lbl{display:none}

  .scr-dots{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:center;margin:1.6rem 0 .6rem}
  .scr-dot{width:.7rem;height:.7rem;border-radius:50%;border:0;padding:0;cursor:pointer;
    background:var(--line)}
  .scr-dot.on{background:var(--accent);transform:scale(1.25)}

  .course-status{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.75rem 1rem;
    align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;
    padding:1rem 1.1rem;text-align:left;box-shadow:0 8px 24px rgba(20,40,70,.08)}
  .course-status h3{margin:0;font-size:1.15rem;color:var(--ink)}
  .course-status p{margin:.15rem 0 0;color:var(--soft);font-size:.94rem}
  .course-status .continue{grid-column:2;grid-row:1 / span 2;display:inline-flex;
    align-items:center;justify-content:center;gap:.35rem;background:var(--accent);color:#fff;
    border-radius:999px;padding:.7rem 1.1rem;text-decoration:none;font-family:"Baloo 2";
    font-weight:800;white-space:nowrap;min-height:44px}
  .course-meter{grid-column:1 / -1;height:.65rem;border-radius:999px;background:var(--surface2);
    overflow:hidden}
  .course-meter span{display:block;height:100%;width:var(--progress);background:var(--accent);
    border-radius:inherit;transition:width .25s ease}
  .intro-skip{background:transparent;color:var(--accent);border:1px solid var(--line);
    border-radius:999px;min-height:44px}

  @media (max-width:760px){
    .scr{padding:0 .6rem}
    main{padding:.6rem .65rem 6.5rem;max-width:100%}
    .scr{min-height:100dvh;padding:0;max-width:100%}
    .scr-top{margin:.2rem 0 .6rem;min-height:2.8rem}
    .scr-body{min-height:auto;width:100%;overflow:visible}
    .scr-body > *{margin-block:.4rem}
    .scr-centro{gap:.7rem;max-width:100%}
    .scr-nav{bottom:.75rem;top:auto;transform:none;min-height:48px;z-index:20}
    .scr-next{right:.75rem;max-width:calc(100vw - 5rem)} .scr-prev{left:.75rem;width:48px;padding:0;justify-content:center}
    .scr-dots{margin:1rem 4rem .4rem;gap:.5rem}
    .scr-dot{width:.8rem;height:.8rem;min-width:.8rem;min-height:.8rem}
    .band-grande img{height:120px}
    .scr-escena{max-height:44dvh;width:100%;object-fit:contain}
    .scr-video{max-height:50dvh}
    .course-status{grid-template-columns:1fr;text-align:center;padding:.9rem}
    .course-status .continue{grid-column:1;grid-row:auto;width:100%}
    .course-meter{grid-column:1}
    .units{grid-template-columns:1fr;gap:.7rem;width:100%}
    a.ucard{padding:.8rem .9rem}
  }

  /* ---------- grabadora de voz ---------- */
  .pw-task{background:var(--surface2);border-radius:14px;padding:1rem 1.2rem;text-align:left}
  .pw-task p{margin:0;line-height:1.6}
  .rec{margin-top:1rem;background:var(--surface2);border-radius:14px;padding:1rem;text-align:left}
  .rec-fila{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
  .rec-btn{background:var(--bad);color:#fff;display:flex;align-items:center;gap:.5rem}
  .rec-btn.on{background:var(--ink)}
  .rec-punto{width:.7rem;height:.7rem;border-radius:50%;background:#fff;display:inline-block}
  .rec-btn.on .rec-punto{animation:reclat 1s infinite}
  @keyframes reclat{50%{opacity:.25}}
  .rec-tiempo{font-family:"Baloo 2";font-weight:700;color:var(--soft)}
  .rec-audio{flex:1;min-width:14rem}
  .rec-nota{margin:.6rem 0 0;font-size:.86rem;color:var(--soft)}
  .rec-estado{margin:.35rem 0 0;font-size:.86rem;font-weight:600;color:var(--ok);min-height:1.1em}

  /* ---------- repaso final ---------- */
  /* ---------- que el contenido de cada actividad quede centrado ---------- */
  .scr-centro .act{width:100%;text-align:left}
  .scr-centro .match{margin-inline:auto}
  .scr-centro .xw{justify-content:center}
  .scr-centro .lsn .gaps{margin-inline:auto}
  .scr-centro .exam .rtext{margin-inline:auto}
  .scr-centro .pwrow{justify-content:center}
  .scr-centro .sd-wrap{justify-content:center}
  /* en el examen, cada pregunta y sus opciones van juntas y centradas */
  .scr-centro .exam .item{max-width:44rem;margin-inline:auto}
  .scr-centro .exam .opts{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-top:.4rem}
  .scr-centro .exam .stem{text-align:center}
  .scr-centro .checkrow{justify-content:center}
  .scr-centro .rec{max-width:44rem;margin-inline:auto}
  .scr-centro .pw-task{max-width:44rem;margin-inline:auto}
  /* la consigna de la actividad, centrada y en tono suave */
  .scr-centro .act > .body > p:first-child{text-align:center;color:var(--soft);
    max-width:40rem;margin:0 auto 1.1rem;font-size:1.02rem}
  /* el marcador vacio contaba en el gap y descolocaba el boton Check */
  .checkrow .score:empty{display:none}
  /* si la actividad es corta, que no quede colgada arriba */

  .selfcheck{background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:1.2rem 1.4rem;text-align:left}
  .sc-intro{margin:0 0 .8rem;color:var(--soft)}
  .sc-lista{list-style:none;margin:0;padding:0;display:grid;gap:.55rem}
  .sc-lista label{display:flex;gap:.7rem;align-items:flex-start;cursor:pointer}
  .sc-lista input{width:1.2rem;height:1.2rem;margin-top:.15rem;accent-color:var(--ok);flex:none}
  .sc-cuenta{margin:1rem 0 0;font-family:"Baloo 2";font-weight:700;color:var(--ok)}
  h1,h2,h3{font-family:"Baloo 2",sans-serif;text-wrap:balance}
  .band{background:var(--accent);color:#fff;border-radius:14px;padding:1rem 1.4rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .band .unum{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.2rem;background:#fff;color:var(--accent);border-radius:12px;padding:0 .8rem;line-height:1.4}
  .band h1{font-size:1.6rem;margin:0;flex:1;min-width:12rem}
  .band .meta{font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
  .scene{display:flex;align-items:flex-end;gap:1rem;margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .scene img{height:210px}
  /* min-width:0 deja que el bocadillo encoja: con el ancho automatico del
     flex no bajaba de su texto y se salia de la pantalla en el movil */
  .bubble{position:relative;background:var(--surface2);border-radius:14px;padding:.8rem 1rem;font-weight:600;flex:1;min-width:0}
  .bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--surface2);border-left:0}
  /* en el movil no caben los personajes y el bocadillo en la misma linea:
     el bocadillo baja debajo y la flecha pasa a apuntar hacia arriba */
  @media (max-width:640px){
    .scene{flex-wrap:wrap;gap:.6rem;padding:.8rem;justify-content:center}
    .scene img{height:150px}
    .bubble{flex:1 1 100%}
    .bubble::before{left:32px;top:-10px;bottom:auto;
      border:10px solid transparent;border-bottom-color:var(--surface2);border-top:0;border-right-color:transparent}
  }
  .act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem;margin:1.2rem 0}
  .act h2{display:flex;align-items:center;gap:.6rem;font-size:1.15rem;margin:0 0 .9rem}
  .act .code{background:var(--accent);color:#fff;border-radius:10px;width:2rem;height:2rem;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .act.done .code{background:var(--ok)}
  button{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1rem;border:0;border-radius:10px;padding:.55rem 1.2rem;cursor:pointer;background:var(--accent);color:#fff}
  button.secondary{background:var(--surface2);color:var(--ink)}
  button:disabled{opacity:.5;cursor:default}
  .checkrow{display:flex;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
  .score{font-weight:700}
  .score.good{color:var(--ok)} .score.partial{color:var(--star)}
  /* crossword */
  .xw{display:flex;gap:1.6rem;flex-wrap:wrap}
  .xw-gridwrap{overflow-x:auto}
  .xw-grid{border-collapse:collapse}
  .xw-grid td{width:2.1rem;height:2.1rem;padding:0;position:relative}
  .xw-grid td.cell{border:1.5px solid var(--soft);background:var(--surface)}
  .xw-grid td.cell input{width:100%;height:100%;border:0;text-align:center;font:700 1.05rem "Source Sans 3";text-transform:uppercase;background:transparent;color:var(--ink);outline-color:var(--accent)}
  .xw-grid td.cell .n{position:absolute;top:1px;left:3px;font-size:.55rem;font-weight:700;color:var(--soft)}
  .xw-grid td.cell.ok{background:#e2f2e9} .xw-grid td.cell.bad{background:#f8e4e1}
  /* palabra entera correcta: se ve al momento, sin pulsar Check */
  .xw-grid td.cell.wok{background:#cdeedd;box-shadow:inset 0 0 0 1.5px var(--ok)}
  .xw-grid td.cell.wok input{color:var(--ok);font-weight:800}
  .xw-clues{flex:1;min-width:16rem;font-size:.95rem}
  .xw-clues h3{margin:.2rem 0 .3rem}
  /* el numero va escrito, no como marcador: el li esta en flex para
     alinear el altavoz y en flex el marcador no se pinta */
  .xw-clues ol{margin:0 0 .8rem;padding-left:0;list-style:none}
  .clue-n{font-weight:800;color:var(--accent);min-width:1.2rem;flex:none;
    text-align:right}
  .clue-t{flex:1}
  .xw-clues li{margin-bottom:.3rem}
  .xw-clues li{display:flex;align-items:flex-start;gap:.45rem;text-align:left}
  .clue-say{background:var(--surface2);color:var(--accent);border:0;border-radius:8px;
    padding:.1rem .4rem;font-size:.9rem;line-height:1.35;cursor:pointer;flex:none;
    font-family:inherit}
  .clue-say:hover{background:var(--accent);color:#fff}
  .clue-say.saying{background:var(--ok);color:#fff}
  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 2rem;max-width:34rem}
  .match .colh{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:700}
  .mbtn{background:var(--surface2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:.5rem .8rem;font-family:"Source Sans 3";font-weight:600;text-align:left}
  .mbtn.sel{border-color:var(--accent)}
  .mbtn.paired{background:#e2f2e9;color:var(--ok);pointer-events:none}
  .mbtn.flash{border-color:var(--bad)}
  /* listening */
  .lsn .gaps{display:grid;gap:.5rem;margin-top:.8rem;max-width:34rem}
  .lsn label{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .lsn input{border:1.5px solid var(--line);border-radius:8px;padding:.35rem .6rem;font:600 1rem "Source Sans 3";width:9rem;background:var(--surface);color:var(--ink)}
  .lsn input.ok{border-color:var(--ok);background:#e2f2e9}
  .lsn input.bad{border-color:var(--bad);background:#f8e4e1}
  .playing{background:var(--ok)!important}
  .provisional{font-size:.8rem;color:var(--soft)}
  /* exam */
  .exam .item{margin-bottom:.9rem}
  .exam .stem{font-weight:600;margin-bottom:.35rem}
  .exam .opts{display:flex;gap:.5rem;flex-wrap:wrap}
  .obtn{background:var(--surface2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:.4rem .9rem;font-family:"Source Sans 3";font-weight:600}
  .obtn.sel{border-color:var(--accent)}
  .obtn.ok{background:#e2f2e9;border-color:var(--ok)}
  .obtn.bad{background:#f8e4e1;border-color:var(--bad)}
  .exam .rtext{background:var(--surface2);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1rem;max-width:44rem}
  /* autoria de las lecturas: son textos propios, no adaptaciones ajenas */
  .credit{margin:.7rem 0 0;font-size:.74rem;font-style:italic;color:var(--soft);
    text-align:right;letter-spacing:.01em}
  /* hub */
  .hub h1{font-size:2rem;margin:.6rem 0}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
  a.ucard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;text-decoration:none;color:var(--ink)}
  a.ucard:hover{border-color:var(--accent)}
  a.ucard .n{font-family:"Baloo 2";font-weight:800;color:var(--accent);font-size:1.3rem}
  a.ucard .stars{color:var(--star);font-size:1.05rem}
  a.ucard .unit-progress{display:flex;align-items:center;justify-content:space-between;
    gap:.7rem;margin-top:.45rem;color:var(--soft);font-size:.82rem}
  a.ucard .unit-meter{height:.45rem;background:var(--surface2);border-radius:999px;
    overflow:hidden;flex:1}
  a.ucard .unit-meter span{display:block;height:100%;background:var(--accent);border-radius:inherit}
  /* celebration */
  #cele{position:fixed;inset:0;background:rgba(27,43,61,.55);display:none;align-items:center;justify-content:center;z-index:9}
  #cele.on{display:flex}
  #cele .box{background:var(--surface);border-radius:18px;padding:2rem 2.6rem;text-align:center;max-width:20rem}
  #cele img{height:230px}
  #cele h2{margin:.4rem 0}
  .crumb{margin:.8rem 0;font-size:.9rem}
  .crumb a{color:var(--accent);font-weight:700;text-decoration:none}
  /* encuentra las diferencias, sobre fotos */
  .sd-wrap{display:flex;gap:1rem;flex-wrap:wrap}
  .sd-scene{flex:1;min-width:min(100%,20rem)}
  .sd-scene h4{margin:0 0 .3rem;font-family:"Baloo 2";color:var(--accent)}
  .sd-img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px}
  .rphoto{width:100%;max-width:34rem;height:auto;display:block;margin:0 0 .9rem;border-radius:12px;border:1px solid var(--line)}
  .sd-hot{position:relative}
  .sd-z{position:absolute;transform:translate(-50%,-50%);background:transparent;
    border:2px dashed transparent;border-radius:50%;padding:0;cursor:pointer}
  .sd-z:hover{border-color:rgba(59,111,181,.5)}
  .sd-z.found{border-color:var(--ok);background:rgba(47,146,104,.22)}
  .demoflag{margin:1.4rem 0 .2rem;background:#fff6e0;border:1px solid #e8cf94;
    border-left:6px solid var(--star);border-radius:12px;padding:.75rem 1rem;
    font-size:.92rem;color:#6b5313}
  /* opener: texto de introduccion + panel ilustrado */
  .opener{display:flex;flex-direction:column;gap:1rem;margin:1.2rem 0}
  .op-text{width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:1.1rem 1.3rem}
  .op-text h3{margin:0 0 .4rem;color:var(--accent);font-size:1.05rem}
  .op-text p{margin:0;line-height:1.65}
  .op-art{width:100%;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:.8rem;gap:.2rem}
  .op-art span{font-size:3.2rem;line-height:1.25}
  .op-art.op-photo{display:block;padding:0;overflow:hidden}
  .op-art.op-photo img{width:100%;height:100%;min-height:12rem;object-fit:cover;display:block;border-radius:13px}
  /* escena dibujada a medida: es SVG, no se recorta como una foto */
  .op-art.op-drawn{background:none;border:0;padding:0}
  .op-art.op-drawn svg{width:100%;height:auto;display:block;border-radius:13px;
    border:1px solid var(--line)}
  .campus-banner{margin:0 0 1.4rem;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
  .campus-banner img{width:100%;max-height:260px;object-fit:cover;display:block}
  /* picture words */
  .pwrow{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .pwrow .pw{position:relative;width:11rem;text-align:center;background:var(--surface2);
    border:2px solid transparent;border-radius:12px;padding:.5rem .2rem .4rem;cursor:pointer;
    font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .pwrow .pw:hover{border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(59,111,181,.16)}
  .pwrow .pw:active{transform:translateY(0) scale(.97)}
  .pwrow .pw.saying{border-color:var(--ok);background:#e2f2e9}
  .pwrow .pw .ico{line-height:1.2;display:flex;align-items:center;justify-content:center;height:7rem}
  .pwrow .pw .ico svg{width:7rem;height:7rem;display:block}
  .pwrow .pw .ico img.art3d{width:7rem;height:7rem;object-fit:contain;display:block}
  .pwrow .pw .ico .emo{font-size:5.2rem}
  .pwrow .pw .spk{position:absolute;top:.25rem;right:.35rem;font-size:.72rem;opacity:0;transition:opacity .12s}
  .pwrow .pw:hover .spk,.pwrow .pw.saying .spk{opacity:.75}
  @media (prefers-reduced-motion:reduce){.pwrow .pw{transition:none}.pwrow .pw:hover{transform:none}}
  .pwrow .pw .w{font-size:1rem;font-weight:700;margin-top:.15rem}
  /* gap text */
  .gt-box{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
  .gt-box span{background:var(--surface2);border-radius:8px;padding:.25rem .7rem;font-weight:700;font-size:.95rem}
  .gt-text{background:var(--surface2);border-radius:10px;padding:1rem 1.2rem;max-width:46rem;line-height:2.1}
  .gt-text input{border:0;border-bottom:2px solid var(--accent);background:transparent;font:600 1rem "Source Sans 3";width:7.5rem;text-align:center;color:var(--ink)}
  .gt-text input.ok{color:var(--ok);border-color:var(--ok)}
  .gt-text input.bad{color:var(--bad);border-color:var(--bad)}
  .gt-text .gn{font-size:.7rem;color:var(--soft);font-weight:700;vertical-align:super}
  /* spot the difference */
  .sd-wrap{display:flex;gap:1.4rem;flex-wrap:wrap}
  .sd-scene{border:2px solid var(--line);border-radius:12px;padding:.5rem;background:#eef7fb}
  .sd-scene h4{margin:.1rem 0 .3rem;text-align:center;font-family:"Baloo 2"}
  .sd-grid{display:grid;gap:2px}
  .sd-cell{width:3.4rem;height:3.4rem;display:flex;align-items:center;justify-content:center;font-size:2.1rem;background:#fff;border-radius:8px}
  .sd-scene.clickable .sd-cell{cursor:pointer}
  .sd-cell.found{background:#e2f2e9;outline:3px solid var(--ok)}
  .sd-cell.flash{outline:3px solid var(--bad)}
  /* video guia de la mascota */
  .guide{margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .guide h2{margin:0 0 .8rem;font-size:1.15rem}
  .guide video{width:100%;max-width:46rem;border-radius:12px;display:block;margin:0 auto;background:var(--surface2)}
  .guide h2{text-align:center}
  /* portada de niveles */
  .lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.2rem}
  .lvcard{display:block;text-decoration:none;color:var(--ink);background:var(--surface);
    border:1px solid var(--line);border-top:6px solid var(--lv);border-radius:18px;
    overflow:hidden;box-shadow:0 10px 28px rgba(20,40,70,.10);
    transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
  .lvcard:hover,.lvcard:focus-visible{border-color:var(--lv);transform:translateY(-6px);
    box-shadow:0 18px 38px rgba(20,40,70,.18);outline:none}
  .lvmedia{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--surface2)}
  .lvmedia video,.lvmedia .lvfallback{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;transition:transform .5s ease,filter .3s ease}
  .lvmedia .lvfallback{z-index:0}
  .lvmedia video{z-index:1}
  .lvcard:hover .lvmedia video,.lvcard:focus-visible .lvmedia video{transform:scale(1.035)}
  .lvshade{position:absolute;inset:auto 0 0;z-index:2;height:48%;pointer-events:none;
    background:linear-gradient(to top,rgba(8,20,36,.68),rgba(8,20,36,0))}
  .lvbadge{position:absolute;left:.75rem;top:.7rem;z-index:3;background:rgba(255,255,255,.92);
    color:var(--lv);border-radius:999px;padding:.25rem .65rem;font-family:"Baloo 2";
    font-size:.78rem;font-weight:800;box-shadow:0 3px 12px rgba(20,40,70,.18)}
  .lvplaying{position:absolute;right:.7rem;top:.7rem;z-index:3;display:flex;align-items:center;
    gap:.28rem;background:rgba(8,20,36,.65);color:#fff;border-radius:999px;padding:.27rem .58rem;
    font-size:.7rem;font-weight:700;opacity:0;transition:opacity .2s ease}
  .lvcard.is-playing .lvplaying{opacity:1}
  .lvpulse{width:.45rem;height:.45rem;background:#66e5ae;border-radius:50%;
    box-shadow:0 0 0 0 rgba(102,229,174,.6);animation:lvpulse 1.8s infinite}
  @keyframes lvpulse{70%{box-shadow:0 0 0 .4rem rgba(102,229,174,0)}100%{box-shadow:0 0 0 0 rgba(102,229,174,0)}}
  .lvinfo{padding:.9rem 1rem 1rem;display:grid;gap:.14rem}
  .lvcard b{font-family:"Baloo 2";font-size:1.25rem;color:var(--lv);line-height:1.2}
  .lvcard .exam{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:700}
  .lvcard .cast{font-size:.9rem;color:var(--soft)}
  .lvcta{display:flex;align-items:center;justify-content:space-between;margin-top:.55rem;
    color:var(--lv);font-family:"Baloo 2";font-weight:800}
  @media (max-width:560px){
    .hub h1{font-size:1.75rem}
    .campus-banner{margin-bottom:1rem}
    .campus-banner img{height:10rem;object-fit:cover}
    .lvcards{gap:.8rem}
    .lvcard{border-radius:16px}
    .lvinfo{padding:.75rem .85rem .85rem}
    .lvcard b{font-size:1.15rem}
    .lvcta{margin-top:.35rem}
  }
  @media (prefers-reduced-motion:reduce){
    .lvcard,.lvmedia video{transition:none}
    .lvcard:hover,.lvcard:focus-visible{transform:none}
    .lvpulse{animation:none}
  }
  /* ---------- tareas visuales del examen A2 Flyers ----------
     Cuatro formatos que se resuelven MIRANDO: poner nombres bajo las
     personas, marcar una de tres imagenes, emparejar cada explorador con
     una letra y escribir la historia de tres vinetas. El dibujo siempre es
     nuestro: personajes de la biblia sobre escenarios del campus. */
  .vis-escena{position:relative;width:100%;border-radius:16px;overflow:hidden;
    border:1px solid var(--line);background:var(--surface2)}
  /* el fondo va detras y en absoluto, y la fila de personajes fluye por
     encima: si la fila se posiciona al fondo del recuadro, en cuanto son
     cinco se parte en dos lineas y la de arriba se sale de la escena */
  .vis-escena > img.fondo{position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;opacity:.5}
  .vis-fila{position:relative;display:flex;justify-content:center;align-items:flex-end;
    gap:.5rem;padding:.9rem .6rem;flex-wrap:wrap}
  .vis-quien{display:flex;flex-direction:column;align-items:center;gap:.25rem;min-width:5rem}
  .vis-quien img{height:6.6rem;width:auto;object-fit:contain;
    filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
  .vis-quien input{width:5.4rem;text-align:center;font-weight:700;
    border:2px solid var(--line);border-radius:9px;padding:.28rem;background:var(--surface)}
  .vis-quien input.ok{border-color:var(--ok);background:#e2f2e9}
  .vis-quien input.bad{border-color:var(--bad)}
  .vis-quien input.revelado{border-color:var(--accent);background:var(--surface2)}
  .vis-quien .num{font-size:.78rem;font-weight:800;color:var(--soft)}
  .vis-banco{display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;margin:.7rem 0}
  .vis-banco span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:.28rem .8rem;font-weight:700;font-size:.92rem}
  .vis-banco span.usado{opacity:.35;text-decoration:line-through}
  .vis-sitio{font-size:.86rem;color:var(--soft);margin:.2rem 0 .6rem}

  /* marcar una de tres */
  .vis-preg{margin:0 0 1.3rem;text-align:left}
  .vis-preg > p{margin:0 0 .45rem;font-weight:700}
  .vis-ops{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
  .vis-op{background:var(--surface);border:2px solid var(--line);border-radius:14px;
    padding:.6rem .4rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;
    cursor:pointer;font:inherit;color:var(--ink)}
  .vis-op:hover{border-color:var(--accent)}
  .vis-op .letra{font-weight:800;color:var(--soft);font-size:.82rem}
  .vis-op .dib{height:5rem;display:flex;align-items:center;justify-content:center}
  .vis-op .dib img{max-height:5rem;max-width:100%;object-fit:contain}
  .vis-op .dib svg{height:4.4rem;width:4.4rem}
  .vis-op .dib .emo{font-size:3.4rem;line-height:1}
  /* La palabra NO se ve mientras se resuelve: en el examen las imagenes van
     sin etiqueta, y con el pie puesto el alumno lee la respuesta en vez de
     escucharla. Sigue en el aria-label, que es lo que un lector de pantalla
     necesita para saber que hay dibujado — eso no es la respuesta, es la
     imagen. Al corregir aparece, que ahi si ayuda a fijar la palabra. */
  .vis-op .pie{font-size:.82rem;color:var(--soft);visibility:hidden}
  .vis-ops.resuelto .vis-op .pie{visibility:visible}
  .vis-op.sel{border-color:var(--accent);background:var(--surface2)}
  .vis-op.ok{border-color:var(--ok);background:#e2f2e9}
  .vis-op.bad{border-color:var(--bad)}
  .vis-op.marca{outline:3px dashed var(--accent);outline-offset:2px}
  .vis-op[disabled]{cursor:default}


  /* opciones que dibujan una RELACION, no un objeto */
  .vis-op .dib .op-pose{max-height:5rem;width:auto}
  .vis-foto .dib .op-pose{max-height:3.6rem;width:auto}
  .vis-op .dib .op-svg,.vis-foto .dib .op-svg{width:auto;height:100%;color:var(--accent)}
  .op-duenno{display:inline-flex;align-items:flex-end;gap:.15rem}
  .op-duenno img{max-height:4.4rem;width:auto}
  .op-duenno .cosa img,.op-duenno .cosa svg{max-height:2.2rem;width:auto}
  .op-duenno .cosa .emo{font-size:1.6rem}
  /* las cantidades se envuelven: cinco objetos en fila se salen de la tarjeta */
  .op-cuantos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.12rem;max-width:100%}
  .op-cuantos img,.op-cuantos svg{max-height:2rem;width:auto}
  .op-cuantos .emo{font-size:1.5rem}

  /* emparejar con A-H */
  .vis-galeria{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin:.8rem 0 1.1rem}
  .vis-foto{background:var(--surface);border:2px solid var(--line);border-radius:12px;
    padding:.45rem .3rem;display:flex;flex-direction:column;align-items:center;gap:.2rem}
  .vis-foto .letra{font-weight:800;color:var(--accent)}
  .vis-foto .dib{height:3.6rem;display:flex;align-items:center;justify-content:center}
  .vis-foto .dib img{max-height:3.6rem;max-width:100%;object-fit:contain}
  .vis-foto .dib svg{height:3.2rem;width:3.2rem}
  .vis-foto .dib .emo{font-size:2.4rem;line-height:1}
  .vis-foto.usada{border-color:var(--ok)}
  .vis-gente{display:flex;flex-wrap:wrap;justify-content:center;gap:.7rem}
  .vis-gente .vis-quien img{height:6.4rem}
  .vis-gente select{font:inherit;font-weight:700;border:2px solid var(--line);
    border-radius:9px;padding:.26rem .5rem;background:var(--surface)}
  .vis-gente select.ok{border-color:var(--ok);background:#e2f2e9}
  .vis-gente select.bad{border-color:var(--bad)}
  .vis-gente select.revelado{border-color:var(--accent);background:var(--surface2)}

  /* historia de tres vinetas */
  .vis-tira{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:.8rem}
  .vis-vineta{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
  .vis-vineta .marco{position:relative;height:11rem;background:var(--surface2)}
  .vis-vineta .marco img.fondo{width:100%;height:100%;object-fit:cover;opacity:.6}
  .vis-vineta .marco .gente{position:absolute;inset:auto 0 0 0;display:flex;
    justify-content:center;align-items:flex-end;gap:.2rem}
  .vis-vineta .marco .gente img{height:7.6rem;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28))}
  .vis-vineta .nn{position:absolute;top:.35rem;left:.45rem;background:var(--accent);color:#fff;
    border-radius:999px;width:1.5rem;height:1.5rem;display:grid;place-items:center;
    font-weight:800;font-size:.82rem}
  .vis-vineta .pista{padding:.45rem .55rem;font-size:.85rem;color:var(--soft);font-weight:700}
  /* el lenguaje de apoyo: la gramatica de la unidad y unas palabras suyas.
     Sin esto la vineta generica valdria para cualquier unidad, y la idea es
     que el alumno escriba con lo que acaba de aprender. */
  .vis-apoyo{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem;
    justify-content:center;margin:0 0 .7rem;font-size:.86rem}
  .vis-apoyo b{color:var(--accent);margin-right:.3rem}
  .vis-apoyo span{background:var(--surface2);border:1px solid var(--line);
    border-radius:999px;padding:.16rem .65rem;font-weight:700;color:var(--soft)}
  .vis-historia textarea{width:100%;min-height:6.5rem;font:inherit;padding:.7rem .85rem;
    border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);resize:vertical}
  .vis-historia textarea:focus{outline:0;border-color:var(--accent)}
  .vis-contador{font-size:.86rem;color:var(--soft);margin-top:.35rem;text-align:right}
  .vis-contador.bien{color:var(--ok);font-weight:700}
  .vis-modelo{margin-top:.7rem;background:var(--surface2);border-radius:12px;
    padding:.7rem .9rem;text-align:left;font-size:.94rem}

  /* la etiqueta que dice a que clase de 5.o sirve la tarea */
  .vis-kpi{display:flex;flex-wrap:wrap;gap:.4rem;justify-content:center;margin-bottom:.7rem}
  .vis-kpi span{background:var(--surface2);border:1px solid var(--line);border-radius:999px;
    padding:.18rem .7rem;font-size:.76rem;color:var(--soft);font-weight:700}

  @media (max-width:640px){
    .vis-ops{grid-template-columns:1fr}
    .vis-galeria{grid-template-columns:repeat(2,1fr)}
    .vis-tira{grid-template-columns:1fr}
    .vis-quien img{height:6.4rem}
    .vis-vineta .marco{height:9rem}
  }
</style>

<!-- Splash de marca. La ruta relativa vale igual servido desde
     nis.cohasset.pe/nis-fun/ que desde GitHub Pages. Con data-key propia
     sale al abrir el curso aunque ya se hubiera visto en el portal (mismo
     origen, misma sessionStorage); sigue siendo una vez por sesion, asi
     que no reaparece al abrir cada una de las 45-55 unidades. -->
<script src="../nis-splash.js?v=4" data-key="nis_splash_curso"></script>
<script src="crossword-layout.js"></script>
<script src="emoji-map.js"></script>
<script src="vocab-art.js?v=1"></script>
<script src="orientacion.js?v=1"></script>
<script src="screens.js?v=4"></script>
<script src="banner.js?v=8"></script>
<script src="magicbox.js?v=4"></script>
<script src="recorder.js?v=1"></script>
<!-- el curso comparte dominio y sesion con el portal -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
<script src="../../config.js"></script>
<script src="backend.js?v=1"></script>
<main id="app"><div class="app-loading" role="status" aria-live="polite">
  <div><span aria-hidden="true"></span><strong>Preparing your course…</strong>

<div id="cele"><div class="box"><img id="cele-img" alt=""><h2>Well done!</h2><p id="cele-msg"></p><button onclick="document.getElementById('cele').classList.remove('on')">OK</button></div></div>
<script>
const qs = new URLSearchParams(location.search);
const LEVEL = qs.get('level');
const UNIT = qs.get('unit');
const app = document.getElementById('app');
const COLORS = { starters:'#d97d0d', movers:'#2f9268', flyers:'#3b6fb5' };
// Escapa el texto que va dentro de un atributo (las palabras del wordlist
// llevan apostrofes: chemist's).
// Modo demostracion (?demo=1): solo las dos primeras unidades de cada nivel,
// con un aviso visible. Sirve para ensenar el curso sin abrir las 150.
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const Q = extra => (DEMO ? extra + '&demo=1' : extra);

const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                          .replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* A donde lleva el boton "Portal". Al curso se entra desde el portal, y
   ademas en una pestana nueva: alli no hay historial, asi que sin este
   boton el alumno se queda dentro del curso sin manera de volver.
   Se busca por orden: la ruta que escribe el portal al enlazar (?back=),
   la pagina de la que se vino, y lo guardado antes en esta sesion —el
   propio curso no cuenta como origen. Fuera del portal (por ejemplo en
   GitHub Pages) no hay a donde volver y el boton no se pinta.
   Es lo mismo que hace el boton "Home" de los readers. */
const PORTAL = (() => {
  const CLAVE = 'nisfun-portal';
  const propio = u => /\/nis-fun\//.test(u);
  const seguro = u => u && !/^[a-z][a-z0-9+.\-]*:/i.test(u) && u.slice(0, 2) !== '//';
  try {
    let back = qs.get('back');
    if (seguro(back)) {
      // el portal escribe "./#ruta" contando desde su raiz, y el curso
      // cuelga dos carpetas mas abajo
      if (back.slice(0, 2) === './') back = '../../' + back.slice(2);
      else if (back[0] === '#') back = '../../' + back;
      sessionStorage.setItem(CLAVE, back);
      return back;
    }
    const r = document.referrer;
    if (r) {
      const u = new URL(r);
      if (u.origin === location.origin && !propio(u.pathname)) {
        const ruta = u.pathname + u.search + u.hash;
        sessionStorage.setItem(CLAVE, ruta);
        return ruta;
      }
    }
    const guardado = sessionStorage.getItem(CLAVE);
    if (guardado) return guardado;
  } catch (e) {}
  return location.hostname === 'nis.cohasset.pe' ? '../../' : null;
})();
// El servidor cachea los mp4 4 horas y la ruta no cambia al reemplazarlos:
// subir esta fecha obliga al navegador a volver a bajarlos.
const VIDEO_V = '2026-08-25-marca';
if (COLORS[LEVEL]) document.documentElement.style.setProperty('--accent', COLORS[LEVEL]);
const CHAR = (slug, pose) => `../assets/characters/${LEVEL}/${slug}/pose-${String(pose).padStart(2,'0')}.png?v=${ART_V}`;
// si no existe el PNG (arte 3D), cae al SVG plano provisional
const FB = `onerror="this.onerror=null;this.src=this.src.replace('.png','.svg')"`;
const store = {
  key: (u)=>`nisfun-${LEVEL}-u${u}`,
  get(u){ try{return JSON.parse(localStorage.getItem(this.key(u))||'{}')}catch(e){return{}} },
  set(u,d){ localStorage.setItem(this.key(u), JSON.stringify(d)) }
};

// El contenido se cachea igual que los mp4: al cambiar una unidad hay que
// subir esta fecha o el alumno sigue viendo la version anterior.
const CONTENT_V = '2026-08-27-voz';
const AUDIO_V = '2026-08-27';   // sube al grabar audio nuevo
/* Los dibujos tambien. Cloudflare los guarda siete dias, asi que una
   lamina rehecha seguia sin verse aunque el servidor ya tuviera la nueva:
   el 27-ago-2026 el alumno miraba el zoo vacio y la fachada del colegio
   donde la historia dice cocina del faro. Con la version en la URL, cada
   publicacion se ve sola y no hay que vaciar la cache a mano. */
const ART_V = '2026-08-28';    // sube al cambiar laminas o dibujos
// banner.js se carga antes que este script y tambien pinta personajes:
// se comparte por window para no depender del orden de carga.
window.ART_V = ART_V;
async function j(path){
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + sep + 'v=' + CONTENT_V);
  if(!r.ok) throw new Error(path);
  return r.json();
}

               alt="${l.mascot[0].toUpperCase()+l.mascot.slice(1)} invites you to explore ${l.name}">

                 poster="../assets/videos/posters/${l.mascot}-intro.jpg?v=${VIDEO_V}"
                 data-level-preview aria-hidden="true">

/* Las tres portadas usan los mismos videos de las mascotas que presentan el
   curso. Solo se reproduce una tarjeta cuando esta realmente en pantalla:
   mantiene la portada viva sin descargar tres videos completos en un movil. */
function levelPreviews(root){
  const videos = [...root.querySelectorAll('[data-level-preview]')];
  if(!videos.length || matchMedia('(prefers-reduced-motion: reduce)').matches ||
     (navigator.connection && navigator.connection.saveData)) return;
  const LOOP_START = 2.35; // omite el splash de marca al repetir la miniatura
  videos.forEach(v => {
    v.addEventListener('loadedmetadata', () => { if(v.currentTime < LOOP_START) v.currentTime = LOOP_START; }, {once:true});
    v.addEventListener('ended', () => {
      if(v.dataset.visible === '1') { v.currentTime = LOOP_START; v.play().catch(()=>{}); }
    });
  });
  const change = (v, visible) => {
    const card = v.closest('.lvcard');
    v.dataset.visible = visible ? '1' : '0';
    if(visible) {
      if(v.readyState >= 1 && v.currentTime < LOOP_START) v.currentTime = LOOP_START;
      v.play().then(()=>card.classList.add('is-playing')).catch(()=>{});
    } else { v.pause(); card.classList.remove('is-playing'); }
  };
  if('IntersectionObserver' in window){
    const observer = new IntersectionObserver(entries => entries.forEach(e =>
      change(e.target, e.isIntersecting && e.intersectionRatio >= .35)), {threshold:[0,.35]});
    videos.forEach(v => observer.observe(v));
  } else videos.forEach(v => change(v, true));
}

/* ---------------- HUB ---------------- */
async function hub(){
  const idx = await j(`../content/${LEVEL}/index.json`);
  document.title = idx.name;
  app.classList.add('hub');
  const mascota = idx.mascot[0].toUpperCase() + idx.mascot.slice(1);
  const unidades = DEMO ? idx.units.slice(0,2) : idx.units;
  const progreso = unidades.map(u => {
    const p = store.get(u.n);
    return { unit:u, done:Math.min(4, p.done ? Object.keys(p.done).length : 0) };
  });
  const totalHechas = progreso.reduce((sum, p) => sum + p.done, 0);
  const totalPasos = Math.max(1, unidades.length * 4);
  const porcentaje = Math.round(totalHechas * 100 / totalPasos);
  const ultima = Number(localStorage.getItem(`nisfun-${LEVEL}-lastUnit`));
  const ultimaPendiente = progreso.find(p => p.unit.n === ultima && p.done < 4);
  const siguiente = ultimaPendiente || progreso.find(p => p.done < 4) || progreso[progreso.length - 1];
  const terminadas = progreso.filter(p => p.done >= 4).length;
  const introKey = `nisfun-${LEVEL}-intro-seen`;
  const introVista = localStorage.getItem(introKey) === '1';

  const estadoCurso = `<section class="course-status" aria-label="Course progress">
    <div><h3>${totalHechas ? `Continue Unit ${siguiente.unit.n}` : 'Start your first unit'}</h3>
      <p>${terminadas} of ${unidades.length} units completed · ${porcentaje}% overall</p></div>
    <a class="continue" href="${Q(`?level=${LEVEL}&unit=${siguiente.unit.n}`)}">
      ${totalHechas ? 'Continue learning' : 'Start learning'} <span aria-hidden="true">›</span></a>
    <div class="course-meter" role="progressbar" aria-label="Overall course progress"
      aria-valuemin="0" aria-valuemax="100" aria-valuenow="${porcentaje}">
      <span style="--progress:${porcentaje}%"></span></div>
  </section>`;

  // Las unidades se reparten en tandas para que quepan de una ojeada; con
  // pocas no tiene sentido partirlas.
  const POR_PANTALLA = 12;
  const tandas = [];
  for (let k = 0; k < unidades.length; k += POR_PANTALLA)
    tandas.push(unidades.slice(k, k + POR_PANTALLA));

  const tarjeta = u => {
    const p = store.get(u.n);
    const hechas = Math.min(4, p.done ? Object.keys(p.done).length : 0);
    const pct = hechas * 25;
    return `<a class="ucard" href="${Q(`?level=${LEVEL}&unit=${u.n}`)}">
      <span class="n">${u.n}</span> <b>${u.title}</b><br>
      <small>${u.topic}</small><br>
      <span class="stars" aria-hidden="true">${'★'.repeat(hechas)}${'☆'.repeat(4-hechas)}</span>
      <span class="sr-only">${hechas} of 4 activities completed.</span>
      <span class="unit-progress"><span class="unit-meter" aria-hidden="true"><span style="width:${pct}%"></span></span>
        <span>${hechas}/4</span></span></a>`;
  };

  const pantallas = [
    { titulo: idx.name,
      etiquetaSiguiente: `Meet ${mascota}`,
      html: `<div class="scr-centro">
        ${BANNER.html(idx, LEVEL)}
        ${estadoCurso}
        ${DEMO ? `<div class="demoflag">Demonstration — this preview covers the first two units.
           The full course has ${idx.units.length} units.</div>` : ''}
        <p class="scr-pie">Meet the characters in 3D, then continue with your guide.</p>
        <button class="intro-skip" type="button">Skip introduction and see all units</button>
      </div>`,
      alMostrar(el){
        BANNER.vivo(el);
        const skip = el.querySelector('.intro-skip');
        if (skip) skip.onclick = () => {
          localStorage.setItem(introKey, '1');
          SCREENS.ir(3);
        };
      } },
    { titulo: `Meet ${mascota} — your guide!`,
      etiquetaSiguiente: 'Story time',
      html: `<div class="scr-centro">
        <video class="scr-video" controls preload="metadata"
          src="../assets/videos/${idx.mascot}-intro.mp4?v=${VIDEO_V}"
          poster="../assets/videos/posters/${idx.mascot}-intro.jpg?v=${VIDEO_V}"
          onerror="this.closest('.scr-centro').querySelector('.ficha').hidden=true"></video>
        <div class="ficha">
          <img src="${CHAR(idx.mascot,1)}" alt=""${window.miraHacia ? miraHacia(LEVEL, idx.mascot, 1, 'der') : ''} ${FB}>
          <p><b>${mascota}</b> is ${(MASCOTA[idx.mascot]||{}).que||'your guide'}.
             “${(MASCOTA[idx.mascot]||{}).dice||''}”</p>
        </div>
      </div>` },
  ];

  // Los cuentos del nivel, si los hay. Se comprueba al vuelo: Starters ya
  // tiene los seis de G1 y los demas iran llegando.
  pantallas.push({
    titulo: 'Story time — read a book',
    etiquetaSiguiente: 'Units',
    html: `<div class="scr-centro"><div id="cuentos">
        <p class="scr-pie">Looking for stories…</p></div></div>`,
    alMostrar(el){ pintaCuentos(el.querySelector('#cuentos'), LEVEL); } });

  tandas.forEach((tanda, k) => pantallas.push({
    titulo: tandas.length > 1
      ? `Units ${tanda[0].n}–${tanda[tanda.length-1].n}`
      : 'Units',
    etiquetaSiguiente: 'More units',
    html: `<div class="scr-centro">
      ${k === 0 ? estadoCurso : ''}
      <div class="units">${tanda.map(tarjeta).join('')}</div></div>`,
    alMostrar(){ localStorage.setItem(introKey, '1'); }
  }));

  SCREENS.montar(app, pantallas, {
    arriba: { href: Q('?'), texto: 'Fun for Nordic' },

/* Lo que cuenta cada mascota de si misma. Sale debajo de su video, que
   antes se quedaba solo en medio de una pantalla vacia. */

/* Los cuentos de Nordic Little Readers que le tocan a este nivel.
 *
 * Viven fuera del curso (readers/) porque tambien se leen desde el portal,
 * asi que aqui solo se listan los que existen. Si todavia no hay ninguno
 * para el nivel, la pantalla lo dice en vez de quedarse en blanco. */
const CUENTOS_DE = { starters: ['G1', 'G2'], movers: ['G3', 'G4'], flyers: ['G5'] };

async function pintaCuentos(el, nivel){
  if (!el) return;
  let libros = [];
  try {
    const r = await fetch('../readers/data/index.json', {cache: 'no-cache'});
    if (r.ok) libros = (await r.json()).libros || [];
  } catch(e){}
  const mios = libros.filter(l => (CUENTOS_DE[nivel] || []).includes(l.grado));
  if (!mios.length){
    el.innerHTML = `<p class="scr-pie">The stories for this level are on their way.</p>`;
    return;
  }
  el.innerHTML = `<div class="cuentos">${mios.map(l => `
    <a class="cuento" href="../readers/?id=${esc(l.id)}">
      <img src="../readers/${esc(l.portada)}" alt="" onerror="this.remove()">
      <b>${esc(l.titulo)}</b>
      <small>${esc(l.objetivo)}</small>
    </a>`).join('')}</div>`;
}

/* ---------------- UNIT ---------------- */
let UD, PROG;
/* Marca en la historia las palabras de la unidad.
 *
 * El alumno lee el texto de apertura antes de ver el vocabulario, y las
 * palabras nuevas le pasan por delante sin que se entere de que son las
 * importantes. Marcadas, la historia hace de primera presentacion.
 *
 * Se marca solo la primera vez que sale cada palabra: subrayarlas todas
 * convierte el parrafo en un semaforo y deja de destacar nada.
 */
function marcaClaves(texto, wordlist){
  const vistas = new Set();
  let out = esc(texto);
  (wordlist || []).forEach(w => {
    const p = (typeof w === 'string' ? w : (w.w || '')).trim();
    if (!p || vistas.has(p.toLowerCase())) return;
    vistas.add(p.toLowerCase());
    const escapada = p.replace(/[^A-Za-z0-9' ]/g, '');
    if (!escapada) return;
    const re = new RegExp('(^|[^A-Za-z<>])(' + escapada + ')(?![A-Za-z])', 'i');
    out = out.replace(re, (m, antes, palabra) =>
      antes + '<mark class="clave">' + palabra + '</mark>');
  });
  return out;
}

function makeIntro(ud){
  if (ud.scene && ud.scene.intro) return ud.scene.intro;
  const cap = n => n.charAt(0).toUpperCase()+n.slice(1);
  const c1 = cap(ud.characters[0]||''), c2 = cap(ud.characters[1]||c1);
  if (LEVEL==='starters') return `Hello, explorers! Today ${c1} and ${c2} are playing with the world of ${ud.topic}. Look at the big pictures, say every new word out loud and listen to the story with your best ears. Pip is hiding somewhere in this unit too! When you finish all the games, you win a star. Ready, explorers? One, two, three… let's go!`;
  if (LEVEL==='movers') return `Welcome back, Fjord Club! In this unit, ${c1} and ${c2} discover the world of ${ud.topic}. First learn the picture words, then read carefully and listen to your friends — the answers are always hiding in the story. You will also practise ${ud.grammar}. Luna is watching and she only barks for good answers. The adventure starts now!`;
  return `The Aurora Expedition continues! This time, ${c1} and ${c2} take you deep into the world of ${ud.topic}. Read the texts slowly, listen twice like in the real exam, and use ${ud.grammar} like a true explorer. Every activity you finish takes you one step closer to the Flyers exam — and Kili is carrying a star with your name on it. Good luck, explorer!`;
}
function sceneFor(ud){
  const t = ((ud.topic||'')+' '+(ud.title||'')+' '+(ud.grammar||'')).toLowerCase();
  const has = (...ws)=>ws.some(w=>t.includes(w));
  // Deporte y movimiento
  if (has('hockey','sport','football','match','team','ball','game of')) return 'hockey';
  if (has('run','athletic','exercise','race','fit','body','face','health','hair','tall','strong')) return 'track';
  // Palabras y letras
  if (has('librar','book','read','stor','writ','letter','spell','alphabet','biograph','diary','note')) return 'library';
  // Aula: lo escolar y la gramatica que no tiene mundo propio
  if (has('school','classroom','lesson','subject','timetable','homework','study','exam','test','practice','teacher','pencil','material')) return 'classroom';
  // Mirador: mar, cielo, clima, mundo
  if (has('beach','sea','ocean','island','boat','fish','swim','sail','geograph','space','sky','star','planet','world','country','weather','season','rain','snow','sunny','cloud','wind','storm')) return 'mirador';
  // Picnic: comida y celebraciones de mesa
  if (has('food','fruit','vegetable','eat','drink','breakfast','lunch','dinner','picnic','meal','snack','cook','hungry','thirst','cake','kitchen')) return 'picnic-garden';
  // Huerto: naturaleza y animales
  if (has('garden','plant','flower','tree','farm','countryside','nature','grow','animal','pet','bird','insect','zoo')) return 'garden';
  // Plaza del ajedrez: numeros, cantidades y comparaciones
  if (has('number','count','math','quantit','compar','superlativ','measure','money','price','how many','how much','more','most','less')) return 'chess-plaza';
  // Fachada: la ciudad, la casa, el trabajo, los viajes
  if (has('town','city','place','building','street','direction','way','map','shop','buy','work','job','travel','transport','holiday','trip','home','house','room','bedroom','furniture','chore','clean','live','clothes','wear')) return 'facade';
  // Entrada: la gente
  if (has('hello','welcome','greet','friend','family','people','person','name','telephone','phone','feel','happy','sad','personal','who')) return 'entrance';
  // Anfiteatro: fiesta, musica y repaso
  if (has('review','party','celebrat','music','show','concert','birthday','danc','sing','hobb','free time','screen')) return 'amphitheater';
  // Laberinto: juego y posicion
  // el laberinto es una vista aerea y un personaje de pie encima no pega
  if (has('game','play','toy','prepos','position','where is','behind','between','hide')) return 'mirador';
  // Tiempo y rutina
  if (has('time','clock','hour','day','week','month','routine','morning','afternoon','night','often','always','frequen')) return 'campus-hex';
  // Sin tema propio (gramatica pura): se reparte por numero de unidad para
  // que ninguna pagina quede sin ilustracion y no salga siempre la misma.
  const pool = ['campus-hex','chess-plaza','amphitheater','entrance','facade','garden','mirador','classroom'];
  return pool[(Number(ud.number)||0) % pool.length];
}
async function unit(){
  UD = await j(`../content/${LEVEL}/unit-${String(UNIT).padStart(2,'0')}.json`);
  try { localStorage.setItem(`nisfun-${LEVEL}-lastUnit`, String(UNIT)); } catch(e) {}
  PROG = store.get(UD.number); PROG.done = PROG.done || {};
  document.title = `Unit ${UD.number} · ${UD.title}`;
  // el JSON las guarda en el orden en que se escribieron (F antes que E);
  // el alumno las espera por letra
  const digital = UD.activities.filter(a=>a.outputs.includes('digital'))
    .slice().sort((x,y)=>(x.code||'').localeCompare(y.code||''));

  const escenaHTML = (()=>{
    const sc = sceneFor(UD);
    const respaldo = sc ? `../assets/scenes/${sc}.jpg?v=${ART_V}` : '';
    return `<img class="scr-escena" alt=""
      src="../assets/unit-scenes/${LEVEL}-${UD.number}.jpg?v=${ART_V}"
      onerror="this.onerror=null;${respaldo ? `this.src='${respaldo}'` : `this.remove()`}">`;
  })();

  // Las de wordlist_extra vienen del Scope & Sequence: son las palabras

          return `<div class="guia">

/* ---- repaso final: el alumno marca lo que ya sabe hacer ---- */
function pintaSelfCheck(el, digital){
  if (!el) return;
  const clave = `nisfun-sc-${LEVEL}-u${UD.number}`;
  let marcado = {};
  try { marcado = JSON.parse(localStorage.getItem(clave) || '{}'); } catch(e){}

  // Lo que puede hacer sale de la propia unidad: el vocabulario, la
  // gramatica y lo que pide cada actividad.
  const puedo = [
    `I can say and write the new words: ${(UD.wordlist||[]).slice(0,6).join(', ')}…`,
    UD.grammar ? `I can use <b>${UD.grammar}</b>.` : null,
    `I can understand the story of this unit.`,
  ].filter(Boolean);
  // Lo que la secuencia del colegio espera de este grado. Es lo que el
  // profesor tiene que poder dar por conseguido al acabar el ano, asi que
  // el alumno lo ve aqui con sus mismas palabras.
  const delGrado = ((UD.scope||{}).outcomes||[]).map(o => `<b>${esc(o.destreza)}</b> — ${esc(o.puede)}`);

  digital.forEach(a => {
    if (a.type === 'listening') puedo.push('I can listen and write the missing words.');
    if (a.type === 'crossword') puedo.push('I can read a clue and write the word.');
    if (a.type === 'match_words') puedo.push('I can match words that go together.');
    if (a.type === 'exam_task') puedo.push('I can choose the right answer in an exam task.');
    if (a.type === 'gap_text') puedo.push('I can read a text and fill in the gaps.');
    if (a.type === 'spot_diff') puedo.push('I can compare two pictures and say the differences.');
    if (a.type === 'pairwork') puedo.push('I can talk about this topic with a partner.');
    if (a.type === 'label_people') puedo.push('I can listen and write the right name under each person.');
    if (a.type === 'picture_mc') puedo.push('I can listen and choose the right picture.');
    if (a.type === 'match_pictures') puedo.push('I can listen and match each person to a picture.');
    if (a.type === 'picture_story') puedo.push('I can look at three pictures and write the story in 20-25 words.');
  });

  el.innerHTML = `
    <p class="sc-intro">Tick the things you can do. Be honest — it helps your teacher.</p>
    <ul class="sc-lista">${puedo.map((t,i)=>`
      <li><label><input type="checkbox" data-i="${i}"${marcado[i]?' checked':''}>
        <span>${t}</span></label></li>`).join('')}</ul>
    <p class="sc-cuenta"></p>
    ${delGrado.length ? `<div class="sc-grado">
      <h4>${esc(((UD.scope||{}).tema)||'')} · ${esc(((UD.scope||{}).grado)||'')}</h4>
      <p class="sc-nota">This unit is part of what you will be able to do
        by the end of the year:</p>
      <ul>${delGrado.map(t=>`<li>${t}</li>`).join('')}</ul>
    </div>` : ''}`;

  const cuenta = () => {
    const n = el.querySelectorAll('input:checked').length;
    el.querySelector('.sc-cuenta').textContent = `${n} / ${puedo.length} — well done!`;
  };
  el.querySelectorAll('input').forEach(c => c.onchange = () => {
    marcado[c.dataset.i] = c.checked;
    try { localStorage.setItem(clave, JSON.stringify(marcado)); } catch(e){}
    cuenta();
    // y al portal, para que el profesor vea que dice saber hacer
    if (window.BACKEND) BACKEND.guardar('selfcheck',
      {nivel: LEVEL, unidad: UD.number, codigo: 'SC'},
      {puede: puedo.filter((_,i)=>marcado[i]), total: puedo.length});
  });
  cuenta();
}

/* ---- pronunciacion: palabras sueltas y frases -----------------------
   Un mp3 grabado por palabra (audio/words). Si falta el archivo o el
   navegador no puede reproducirlo, lo lee la voz del sistema, que siempre
   esta. Las pistas del crucigrama son frases: para esas se usa la voz del
   navegador salvo que exista grabacion.                                  */
const SAY = {
  cache: {},
  sonando: null,          // lo ultimo que se puso, para poder cortarlo

  /* Corta lo que este sonando. Se llama al cambiar de pantalla: si no, la
     historia se sigue oyendo encima de la actividad siguiente. */
  parar(){
    try { if (this.sonando) { this.sonando.pause(); this.sonando.currentTime = 0; } } catch(e){}
    this.sonando = null;
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
    document.querySelectorAll('.saying').forEach(b => b.classList.remove('saying'));
  },
  slug(t){
    // mismo criterio que tools/gen_audio_edge.py: sin etiquetas, con los
    // guiones largos y los puntos suspensivos ya convertidos
    return String(t).replace(/<[^>]+>/g,' ').replace(/…/g,'...').replace(/—/g,', ')
      .replace(/\s+/g,' ').trim()
      .toLowerCase().replace(/'/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  },
  voz(t, ritmo, reintento){
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      // La primera vez la lista de voces todavia no ha llegado y speak()
      // no dice nada: por eso la primera pista del crucigrama se quedaba
      // muda. Se espera al aviso del navegador y se reintenta una vez.
      if (!speechSynthesis.getVoices().length && !reintento) {
        speechSynthesis.onvoiceschanged = () => {
          speechSynthesis.onvoiceschanged = null;
          this.voz(t, ritmo, true);
        };
        setTimeout(() => this.voz(t, ritmo, true), 350);   // por si no avisa
        return;
      }
      const u = new SpeechSynthesisUtterance(t);
      u.lang = 'en-GB'; u.rate = ritmo || 0.85;
      const gb = speechSynthesis.getVoices().find(v => /en[-_]GB/i.test(v.lang));
      if (gb) u.voice = gb;
      speechSynthesis.speak(u);
    } catch(e){}
  },
  play(w, btn){
    this.parar();
    const fin = () => btn && btn.classList.remove('saying');
    btn && btn.classList.add('saying');
    const src = '../audio/words/' + this.slug(w) + '.mp3?v=' + AUDIO_V;
    let a = this.cache[src];
    if (!a){ a = this.cache[src] = new Audio(src); a.preload = 'auto'; }
    a.currentTime = 0;
    this.sonando = a;
    a.onended = fin;
    a.onerror = () => { this.sonando = null; this.voz(w); setTimeout(fin, 700); };
    const pr = a.play();
    if (pr && pr.catch) pr.catch(() => { this.voz(w); setTimeout(fin, 700); });
  },
  /* carpeta: clues (pistas), stories (la historia), bubbles (bocadillos)
     o acts (lo que lee la mascota). Los graba tools/gen_audio_edge.py con
     este mismo nombre, asi que no hace falta ninguna lista. */
  frase(t, btn, carpeta){
    this.parar();
    const fin = () => btn && btn.classList.remove('saying');
    btn && btn.classList.add('saying');
    const src = '../audio/' + (carpeta || 'clues') + '/' + this.slug(t).slice(0, 60) + '.mp3?v=' + AUDIO_V;
    const a = new Audio(src);
    this.sonando = a;
    a.onended = fin;
    a.onerror = () => { this.sonando = null; this.voz(t, 0.78); setTimeout(fin, 1600); };
    const pr = a.play();
    if (pr && pr.catch) pr.catch(() => { this.voz(t, 0.78); setTimeout(fin, 1600); });
  }
};

function wirePictureWords(){
  document.querySelectorAll('.pwrow .pw[data-say]').forEach(btn => {
    btn.addEventListener('click', () => SAY.play(btn.dataset.say, btn));
  });
}

function complete(code, msg){
  if(!PROG.done[code]){ PROG.done[code]=true; store.set(UD.number, PROG); }
  // lo que escribio queda guardado para que el profesor lo revise
  if (window.BACKEND) {

    const escrito = caja ? [...caja.querySelectorAll('input[type=text],input:not([type]),textarea')]
      .map(i => (i.value||'').trim()).filter(Boolean) : [];
    if (escrito.length) BACKEND.guardar('writing',
      {nivel: LEVEL, unidad: UD.number, codigo: code}, {respuestas: escrito});
  }
  document.getElementById('act-'+code).classList.add('done');

  const ci = document.getElementById('cele-img'); ci.onerror = ()=>{ ci.onerror=null; ci.src = ci.src.replace('.png','.svg'); }; ci.src = CHAR(UD.characters[0],10);

/* Ciclo de intentos de una actividad de escribir.
 *
 * Antes se podia corregir y seguir escribiendo encima con la respuesta ya
 * marcada en rojo, que no ensena nada. Ahora: al comprobar se bloquea; si
 * queda algo mal aparece "Try again", que borra TODO y deja las casillas
 * en blanco para intentarlo de nuevo; al tercer intento se ofrece ver la
 * respuesta.
 *
 * cfg = { entradas(), corrige() -> {bien, total}, revela(), alAcertar() }
 */
const INTENTOS = 3;

function cicloIntentos(el, cfg){
  const fila = el.querySelector('.checkrow.final');
  if (!fila) return;
  const bChk  = fila.querySelector('.chk');
  const bOtra = fila.querySelector('.again');
  const bVer  = fila.querySelector('.reveal');
  const marca = fila.querySelector('.score');
  const cuenta = fila.querySelector('.tries');
  let intento = 0;

  const bloquea = si => cfg.entradas().forEach(i => {
    i.disabled = si;
    i.classList.toggle('bloqueado', si);
  });

  bChk.onclick = () => {
    const r = cfg.corrige();
    intento++;
    bloquea(true);
    marca.textContent = `${r.bien} / ${r.total}`;
    marca.className = 'score ' + (r.bien === r.total ? 'good' : 'partial');

    if (r.bien === r.total){
      bChk.hidden = true; bOtra.hidden = true; bVer.hidden = true;
      cuenta.textContent = '';
      if (cfg.alAcertar) cfg.alAcertar();
      return;
    }
    bChk.hidden = true;
    if (intento < INTENTOS){
      bOtra.hidden = false;
      const quedan = INTENTOS - intento;
      cuenta.textContent = quedan === 1 ? 'one more try' : `${quedan} more tries`;
    } else {
      bVer.hidden = false;
      cuenta.textContent = 'Let\'s look at the answers together.';
    }
  };

  bOtra.onclick = () => {
    // se borra todo: dejar lo de antes en rojo invita a cambiar una letra
    // y volver a probar, y la idea es que lo piense entero otra vez
    //
    // Con casillas y desplegables basta con vaciar valor y clase. Las
    // actividades cuya respuesta es un BOTON pasan su propia limpia(): a un
    // boton no se le puede borrar la clase entera, porque ahi va la suya.
    if (cfg.limpia) cfg.limpia();
    else cfg.entradas().forEach(i => { i.value = ''; i.className = ''; });
    bloquea(false);
    marca.textContent = ''; marca.className = 'score';
    bOtra.hidden = true; bChk.hidden = false;
    const primera = cfg.entradas()[0];
    if (primera) primera.focus();
  };

  if (bVer) bVer.onclick = () => {
    cfg.revela();
    bVer.hidden = true;
    cuenta.textContent = '';
  };
}

/* ---------------------------------------------------------------------
   Tareas visuales del examen A2 Flyers (Listening 1, 3 y 4; R&W 7).
   Las genera tools/gen_visual_flyers.py y las dibuja con lo nuestro:
   personajes de content/cast-flyers.json sobre escenarios de assets/scenes.
   --------------------------------------------------------------------- */

/* Un dibujo de vocabulario, con los tres respaldos que ya usa la pantalla
   de palabras: PNG propio -> SVG propio -> emoji. Se devuelve HTML. */
function visDibujo(palabra){
  const k = String(palabra||'').toLowerCase().replace(/^(a|an|the) /,'');
  const art = (window.VOCAB_ART && VOCAB_ART.get(k)) || null;
  const plano = art || `<span class="emo">${EMOJI[k] || '✏️'}</span>`;
  const slug = k.replace(/'/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return `<img src="../assets/vocab/${slug}.png?v=${ART_V}" alt="${esc(k)}"
    onerror="this.replaceWith(...new DOMParser().parseFromString(this.dataset.fb,'text/html').body.childNodes)"
    data-fb="${esc(plano)}">`;
}

/* Una opción de imagen. Cinco de los seis modos no dibujan un OBJETO sino una
   RELACIÓN — de quién es, qué hora es, cada cuánto, cuántos hay, qué hacía —
   porque en las unidades de gramática pura la respuesta nunca es un sustantivo.
   Todos se componen con arte que ya existe, salvo el reloj y la semana, que se
   dibujan aquí porque son dos formas y no merecen un archivo. */
function visOpcion(o){
  if(typeof o === 'string') return visDibujo(o);          // formato viejo
  switch(o.k){
    case 'pose':  return `<img class="op-pose" src="${CHAR(o.slug, o.pose)}" alt="${esc(o.pie||'')}" ${FB}>`;
    case 'owner': return `<span class="op-duenno">
        <img src="${CHAR(o.slug, o.pose || 1)}" alt="${esc(o.pie||'')}" ${FB}>
        <span class="cosa">${visDibujo(o.word)}</span></span>`;
    case 'count': return `<span class="op-cuantos">${
        Array.from({length:o.n}, () => visDibujo(o.word)).join('')}</span>`;
    case 'clock': return visReloj(o.h, o.m);
    case 'freq':  return visSemana(o.dias);
    default:      return visDibujo(o.word);
  }
}

/* Esfera de reloj. Las manecillas se calculan, así que 7:30 se ve como 7:30 y
   no como "las siete y algo": la hora pequeña también avanza con los minutos,
   que es justo lo que distingue "half past seven" de "seven o'clock". */
function visReloj(h, m){
  const R = 30, cx = 32, cy = 32;
  const aguja = (ang, largo, ancho) => {
    const r = (ang - 90) * Math.PI / 180;
    return `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(r) * largo).toFixed(1)}"
      y2="${(cy + Math.sin(r) * largo).toFixed(1)}" stroke="currentColor"
      stroke-width="${ancho}" stroke-linecap="round"/>`;
  };
  const marcas = Array.from({length:12}, (_,i) => {
    const r = (i * 30 - 90) * Math.PI / 180;
    const x1 = cx + Math.cos(r) * (R - 4), y1 = cy + Math.sin(r) * (R - 4);
    const x2 = cx + Math.cos(r) * (R - 1), y2 = cy + Math.sin(r) * (R - 1);
    return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}"
      y2="${y2.toFixed(1)}" stroke="currentColor" stroke-width="${i % 3 ? 1.2 : 2.4}"/>`;
  }).join('');
  return `<svg class="op-svg" viewBox="0 0 64 64" role="img" aria-label="${h}:${String(m).padStart(2,'0')}">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="currentColor" stroke-width="2.5"/>
    ${marcas}
    ${aguja((h % 12) * 30 + m * 0.5, R - 13, 3.4)}
    ${aguja(m * 6, R - 7, 2.2)}
    <circle cx="${cx}" cy="${cy}" r="2.2" fill="currentColor"/></svg>`;
}

/* Una semana con los días marcados. La frecuencia solo se lee si se ven los
   SIETE días: cinco marcados sin los dos vacíos al lado no dicen "casi
   siempre", dicen "cinco". */
function visSemana(dias){
  const c = Array.from({length:7}, (_,i) =>
    `<rect x="${1 + i * 9}" y="20" width="7.5" height="7.5" rx="1.8"
      fill="${i < dias ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.3"/>`).join('');
  return `<svg class="op-svg op-semana" viewBox="0 0 64 48" role="img"
      aria-label="${dias} de 7 días">${c}
    <text x="32" y="42" text-anchor="middle" font-size="9" fill="currentColor"
      font-family="inherit">${dias}/7</text></svg>`;
}

/* El escenario de fondo. Si la foto no esta, el bloque se queda con el
   color de fondo y los personajes siguen viendose: mejor eso que un icono
   de imagen rota encima de la escena. */
function visFondo(sitio){
  return `<img class="fondo" alt="" src="../assets/scenes/${sitio}.jpg?v=${ART_V}"
    onerror="this.onerror=null;this.src='../assets/scenes/${sitio}.png?v=${ART_V}';
             this.addEventListener('error',()=>this.remove(),{once:true})">`;
}

function visPersona(p){
  // Los adultos no tienen carpeta de poses: salen de una figura del banco 3D,
  // igual que los padres y abuelos del curso. Solo pueden estar de pie.
  const src = p.figura
    ? `../assets/vocab/${p.figura}.png?v=${ART_V}`
    : CHAR(p.slug, p.pose||1);
  return `<img src="${src}" alt="${esc(p.name||p.slug)}" ${p.figura ? '' : FB}>`;
}

/* La etiqueta de KPI. Es lo que convierte una tarea de examen suelta en
   una actividad de la clase de 5.o: dice de que unidad del Scope &
   Sequence sale y que outcome cubre. */
function visKpi(act){
  const k = act.kpi; if(!k) return '';
  const partes = [];
  if(k.examen_parte) partes.push(`${k.examen} · ${k.examen_parte.paper} Part ${k.examen_parte.part}`);
  if(k.tema && k.tema.nombre) partes.push(`${k.grado} · Unit ${k.tema.n}: ${k.tema.nombre}`);
  if(k.destreza) partes.push(k.destreza);
  return `<div class="vis-kpi">${partes.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
}

/* Reproductor compartido de las tres tareas de listening.
   Misma logica que la actividad 'listening': si el mp3 no esta todavia,
   se lee el guion con la voz del navegador y se avisa de que es
   provisional, para que nadie crea que ese es el audio definitivo. */
function visAudio(el, act, guion){
  const caja = document.createElement('div');
  caja.className = 'lsn-mando';
  caja.innerHTML = `<button class="play" type="button">▶ Play</button>
    <button class="stop" type="button" disabled>⏹ Stop</button>
    <span class="provisional"></span>`;
  el.prepend(caja);

  const bPlay = caja.querySelector('.play'), bStop = caja.querySelector('.stop');
  const audio = act.audio ? new Audio(`../audio/${act.audio}`) : null;
  let modo = audio ? 'mp3' : 'tts', hablando = false;
  if (!audio) caja.querySelector('.provisional').textContent =
    '(temporary browser voice — the real audio is coming soon)';
  if (audio) audio.onerror = () => { modo = 'tts';
    caja.querySelector('.provisional').textContent =
      '(temporary browser voice — the real audio is coming soon)'; };

  const estado = son => { bStop.disabled = !son;
    bPlay.textContent = son ? '▶ Playing…' : '▶ Play'; bPlay.disabled = son; };
  if (audio) audio.onended = () => estado(false);

  bPlay.onclick = () => {
    if (modo === 'mp3' && audio && !audio.error){ audio.play(); estado(true); return; }
    const partes = String(guion||'').split('…');
    speechSynthesis.cancel();
    const voces = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.replace(/^[^:]+:/, '').trim());
      u.lang = 'en-GB'; u.rate = .92;
      if (voces.length) u.voice = voces[i % 2] || voces[0];
      if (i === partes.length - 1) u.onend = () => { hablando = false; estado(false); };
      speechSynthesis.speak(u);
    });
    hablando = true; estado(true);
  };
  bStop.onclick = () => {
    if (hablando){ speechSynthesis.cancel(); hablando = false; }
    if (audio){ audio.pause(); audio.currentTime = 0; }
    estado(false);
  };
}
