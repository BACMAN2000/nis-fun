/* La etiqueta de KPI. Es lo que convierte una tarea de examen suelta en
   una actividad de la clase de 5.o: dice de que unidad del Scope &
   Sequence sale y que outcome cubre. */
function visKpi(act){
  const k = act.kpi; if(!k) return '';
  const partes = [];
  if(k.examen_parte) partes.push(T(`${k.examen} · ${k.examen_parte.paper} Part ${k.examen_parte.part}`,
                                   `${k.examen} · ${k.examen_parte.paper} partie ${k.examen_parte.part}`));
  if(k.tema && k.tema.nombre) partes.push(T(`${k.grado} · Unit ${k.tema.n}: ${k.tema.nombre}`,
                                            `${k.grado} · Unité ${k.tema.n} : ${k.tema.nombre}`));
  if(k.destreza) partes.push(k.destreza);
  return `<div class="vis-kpi">${partes.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
}

/* Reproductor compartido de las tres tareas de listening.
   Misma logica que la actividad 'listening': si el mp3 no esta todavia,
   se lee el guion con la voz del navegador y se avisa de que es
   provisional, para que nadie crea que ese es el audio definitivo. */
function visAudio(el, act, guion){
  const caja = document.createElement('div');
  caja.className = 'lsn-mando';
  caja.innerHTML = `<button class="play" type="button">▶ ${T('Play','Lire')}</button>
    <button class="stop" type="button" disabled>⏹ ${T('Stop','Arrêter')}</button>
    <span class="provisional"></span>`;
  el.prepend(caja);

  const bPlay = caja.querySelector('.play'), bStop = caja.querySelector('.stop');
  const audio = act.audio ? new Audio(`${ADIR}/${act.audio}`) : null;
  let modo = audio ? 'mp3' : 'tts', hablando = false;
  if (!audio) caja.querySelector('.provisional').textContent =
    '(temporary browser voice — the real audio is coming soon)';
  if (audio) audio.onerror = () => { modo = 'tts';
    caja.querySelector('.provisional').textContent =
      '(temporary browser voice — the real audio is coming soon)'; };

  const estado = son => { bStop.disabled = !son;
    bPlay.textContent = son ? T('▶ Playing…','▶ Lecture…') : T('▶ Play','▶ Lire'); bPlay.disabled = son; };
  if (audio) audio.onended = () => estado(false);

  bPlay.onclick = () => {
    if (modo === 'mp3' && audio && !audio.error){ audio.play(); estado(true); return; }
    const partes = String(guion||'').split('…');
    speechSynthesis.cancel();
    const voces = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.replace(/^[^:]+:/, '').trim());
      u.lang = 'en-GB'; u.rate = .92;
      if (voces.length) u.voice = voces[i % 2] || voces[0];
      if (i === partes.length - 1) u.onend = () => { hablando = false; estado(false); };
      speechSynthesis.speak(u);
    });
    hablando = true; estado(true);
  };
  bStop.onclick = () => {
    if (hablando){ speechSynthesis.cancel(); hablando = false; }
    if (audio){ audio.pause(); audio.currentTime = 0; }
    estado(false);
  };
}

/* ---- crossword ---- */
crossword(act, el){
  const words = act.data.words[0].row !== undefined ? act.data.words : layoutCrossword(act.data.words);
  let R=0,C=0; const cells={};
  words.forEach(w=>{ [...w.word].forEach((ch,i)=>{
    const r=w.row+(w.dir==='down'?i:0), c=w.col+(w.dir==='across'?i:0);
    cells[r+','+c]=ch; R=Math.max(R,r+1); C=Math.max(C,c+1); });});
  const starts=[...new Set(words.map(w=>w.row+','+w.col))]
    .sort((a,b)=>{const[ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc});
  const num=p=>starts.indexOf(p)+1;
  let g='<table class="xw-grid">';
  for(let r=0;r<R;r++){ g+='<tr>';
    for(let c=0;c<C;c++){ const k=r+','+c;
      g += cells[k]!==undefined
        ? `<td class="cell" data-k="${k}">${starts.includes(k)?`<span class="n">${num(k)}</span>`:''}<input maxlength="1" data-k="${k}"></td>`
        : '<td></td>'; }
    g+='</tr>'; }
  g+='</table>';
  // Altavoz en cada pista: hay ninos que aun estan aprendiendo a leer y
  // oir la frase les deja resolver el crucigrama igual.
  const list=d=>`<ol>${words.filter(w=>w.dir===d)
    .map(w=>({n:num(w.row+','+w.col),w}))
    .sort((a,b)=>a.n-b.n)
    .map(({n,w})=>`<li value="${n}">
      <span class="clue-n">${n}</span>
      <button class="clue-say" type="button" data-clue="${esc(w.clue)}"
        title="${T('Listen to the clue',"Écoute la définition")}" aria-label="${T('Listen to clue',"Écoute la définition")} ${n}">🔊</button>
      <span class="clue-t">${w.clue} <small>(${w.word.length})</small></span></li>`).join('')}</ol>`;
  el.innerHTML = `<div class="xw"><div class="xw-gridwrap">${g}</div>
    <div class="xw-clues"><h3>${T("Across ➜","Horizontal ➜")}</h3>${list('across')}<h3>${T("Down ⬇","Vertical ⬇")}</h3>${list('down')}</div></div>
    <div class="checkrow"><button>${T("Check","Vérifier")}</button><span class="score"></span></div>`;

  /* ---- escribir de corrido y ver la palabra en verde ----------------
     Sin esto hay que pinchar casilla por casilla, que con ninos pequenos
     es media clase perdida. Al teclear una letra el foco salta solo a la
     siguiente casilla de la palabra, y en cuanto una palabra queda bien
     escrita se pinta entera de verde sin esperar al boton Check.       */
  const inp = k => el.querySelector(`input[data-k="${k}"]`);
  const celdasDe = w => [...w.word].map((_, i) =>
    (w.row + (w.dir === 'down' ? i : 0)) + ',' + (w.col + (w.dir === 'across' ? i : 0)));

  // en que palabras entra cada casilla, para saber hacia donde avanzar
  const porCelda = {};
  words.forEach(w => celdasDe(w).forEach((k, i) => {
    (porCelda[k] = porCelda[k] || []).push({ w, i });
  }));

  let dir = 'across';                     // direccion en la que se avanza

  function pintaPalabras(){
    el.querySelectorAll('td.cell').forEach(td => td.classList.remove('wok'));
    words.forEach(w => {
      const ks = celdasDe(w);
      const bien = ks.every(k => ((inp(k) || {}).value || '').toUpperCase() === cells[k]);
      if (bien) ks.forEach(k => inp(k).closest('td').classList.add('wok'));
    });
    // todas las palabras resueltas = actividad hecha
    const todo = Object.keys(cells).every(k => ((inp(k) || {}).value || '').toUpperCase() === cells[k]);
    if (todo) {
      const s = el.querySelector('.score');
      s.textContent = T('All correct!','Tout est juste !'); s.className = 'score good';
      complete(act.code);
    }
  }

  el.querySelectorAll('.clue-say').forEach(b => b.onclick = () => SAY.frase(b.dataset.clue, b, 'clues'));

  el.querySelectorAll('td.cell input').forEach(i => {
    i.addEventListener('focus', () => {
      const ent = porCelda[i.dataset.k] || [];
      // si la casilla solo pertenece a una palabra, se sigue esa direccion
      if (ent.length === 1) dir = ent[0].w.dir;
    });
    i.addEventListener('input', () => {
      i.value = (i.value || '').toUpperCase().slice(0, 1);
      pintaPalabras();
      if (!i.value) return;
      const ent = (porCelda[i.dataset.k] || []).find(e => e.w.dir === dir)
               || (porCelda[i.dataset.k] || [])[0];
      if (!ent) return;
      const ks = celdasDe(ent.w);
      const sig = inp(ks[ent.i + 1]);
      if (sig) { sig.focus(); sig.select(); }
    });
    i.addEventListener('keydown', ev => {
      const ent = (porCelda[i.dataset.k] || []).find(e => e.w.dir === dir)
               || (porCelda[i.dataset.k] || [])[0];
      if (!ent) return;
      const ks = celdasDe(ent.w);
      if (ev.key === 'Backspace' && !i.value) {          // volver atras al borrar
        const ant = inp(ks[ent.i - 1]);
        if (ant) { ev.preventDefault(); ant.focus(); ant.value = ''; pintaPalabras(); }
      }
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft' ||
          ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
        const d = (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') ? 'across' : 'down';
        const paso = (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') ? 1 : -1;
        const [r, c] = i.dataset.k.split(',').map(Number);
        const k2 = d === 'across' ? r + ',' + (c + paso) : (r + paso) + ',' + c;
        const sig = inp(k2);
        if (sig) { ev.preventDefault(); dir = d; sig.focus(); sig.select(); }
      }
    });
  });

  /* '.checkrow button', no 'button' a secas: el primer <button> del bloque
     es el altavoz de la primera pista, que se pinta antes que esta fila. Con
     el selector suelto, Check se enganchaba a ese altavoz — la primera pista
     dejaba de sonar y el boton de comprobar se quedaba sin nada. */
  el.querySelector('.checkrow button').onclick = ()=>{
    let ok=0, tot=0;
    el.querySelectorAll('td.cell').forEach(td=>{ tot++;
      const k=td.dataset.k, v=(td.querySelector('input').value||'').toUpperCase();
      td.classList.remove('ok','bad');
      if(v===cells[k]){ td.classList.add('ok'); ok++; } else if(v) td.classList.add('bad'); });
    const s=el.querySelector('.score');
    s.textContent = T(`${ok} / ${tot} letters`, `${ok} / ${tot} lettres`);
    s.className = 'score '+(ok===tot?'good':'partial');
    pintaPalabras();
    if(ok===tot) complete(act.code);
  };
},

/* ---- match (con distractores opcionales en data.extra) ---- */
match_words(act, el){
  const pairs = act.data.pairs;
  const rights = pairs.map(p=>p.right).concat(act.data.extra||[]).sort(()=>Math.random()-.5);
  const rows = Math.max(pairs.length, rights.length);
  let grid = `<span class="colh">${act.data.left_label||''}</span><span class="colh">${act.data.right_label||''}</span>`;
  for(let i=0;i<rows;i++){
    grid += pairs[i] ? `<button class="mbtn l" data-v="${pairs[i].left}">${pairs[i].left}</button>` : `<span></span>`;
    grid += rights[i]!==undefined ? `<button class="mbtn r" data-v="${rights[i]}">${rights[i]}</button>` : `<span></span>`;
  }
  el.innerHTML = `${act.data.extra?`<p style="margin-top:0"><i>${T('Careful — one answer is extra and matches nothing!','Attention — il y a une réponse en trop, elle ne va avec rien !')}</i></p>`:''}
    <div class="match">${grid}</div><div class="checkrow"><span class="score"></span></div>`;
  let sel=null, matched=0, tries=0;
  const map=Object.fromEntries(pairs.map(p=>[p.left,p.right]));
  el.querySelectorAll('.mbtn.l').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.mbtn.l').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  el.querySelectorAll('.mbtn.r').forEach(b=>b.onclick=()=>{
    if(!sel) return; tries++;
    if(map[sel.dataset.v]===b.dataset.v){
      sel.classList.add('paired'); b.classList.add('paired'); sel.classList.remove('sel'); sel=null; matched++;
      el.querySelector('.score').textContent=`${matched} / ${pairs.length}`;
      if(matched===pairs.length){ el.querySelector('.score').className='score good'; complete(act.code); }
    } else { b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),500); }
  });
},

/* ---- hablar en parejas: la consigna y la grabadora ---- */
pairwork(act, el){
  el.innerHTML = `<div class="pw-task"><p>${act.data.text || act.data.instructions || ''}</p></div>`;
},

/* ---- listening ---- */
listening(act, el){
  el.classList.add('lsn');
  el.innerHTML = `<div class="lsn-mando">
      <button class="play" type="button">▶ ${T('Play','Lire')}</button>
      <button class="pause" type="button" disabled>⏸ ${T('Pause','Pause')}</button>
      <button class="stop" type="button" disabled>⏹ ${T('Stop','Arrêter')}</button>
      <span class="provisional"></span></div>
    <div class="gaps">${act.data.questions.map((q,i)=>
      `<label>${i+1}. ${q.q.replace('…','<b>…</b>')} <input data-i="${i}" autocomplete="off"></label>`).join('')}</div>
    <div class="checkrow final"><button class="chk">${T("Check","Vérifier")}</button>
      <button class="again" type="button" hidden>↻ ${T("Try again","Réessaie")}</button>
      <button class="reveal" type="button" hidden>👁 ${T('See the answers','Voir les réponses')}</button>
      <span class="score"></span><span class="tries"></span></div>`;

  const bPlay = el.querySelector('.play');
  const bPausa = el.querySelector('.pause');
  const bStop = el.querySelector('.stop');
  const audio = new Audio(`${ADIR}/${act.audio}`);
  let modo = 'mp3', hablando = false;

  audio.onerror = () => { modo = 'tts';
    el.querySelector('.provisional').textContent =
      '(temporary browser voice — the real audio is coming soon)'; };

  function estado(sonando){
    bPausa.disabled = !sonando || modo === 'tts';   // la voz del navegador
    bStop.disabled = !sonando;                      // no se puede pausar
    bPlay.textContent = sonando ? T('▶ Playing…','▶ Lecture…') : T('▶ Play','▶ Lire');
    bPlay.disabled = sonando;
  }
  audio.onended = () => estado(false);

  function conVozDelNavegador(){
    const partes = act.data.script.split('…');
    speechSynthesis.cancel();
    const voces = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
    partes.forEach((p, i) => {
      const u = new SpeechSynthesisUtterance(p.replace(/^[^:]+:/, '').trim());
      u.lang = 'en-GB'; u.rate = .92;
      if (voces.length) u.voice = voces[i % 2] || voces[0];
      if (i === partes.length - 1) u.onend = () => { hablando = false; estado(false); };
      speechSynthesis.speak(u);
    });
    hablando = true; estado(true);
  }

  bPlay.onclick = () => {
    if (modo === 'mp3' && !audio.error){ audio.play(); estado(true); return; }
    conVozDelNavegador();
  };
  bPausa.onclick = () => { audio.pause(); estado(false); };
  bStop.onclick = () => {
    if (hablando){ speechSynthesis.cancel(); hablando = false; }
    audio.pause(); audio.currentTime = 0;
    estado(false);
  };

  const entradas = () => [...el.querySelectorAll('.gaps input')];
  cicloIntentos(el, {
    entradas,
    corrige(){
      let bien = 0;
      entradas().forEach(inp => {
        const q = act.data.questions[+inp.dataset.i];
        const ok = inp.value.trim().toLowerCase() === q.answer.toLowerCase();
        inp.className = ok ? 'ok' : 'bad';
        if (ok) bien++;
      });
      return { bien, total: act.data.questions.length };
    },
    revela(){
      entradas().forEach(inp => {
        const q = act.data.questions[+inp.dataset.i];
        inp.value = q.answer; inp.className = 'revelado';
      });
    },
    alAcertar(){ complete(act.code); },
  });
},

/* ---- gap text: párrafo con huecos + caja de palabras ---- */
gap_text(act, el){
  const d = act.data;
  let i = 0;
  const html = d.text.replace(/\{(\d+)\}/g, (m,n)=>`<span class="gn">${n}</span><input data-i="${n-1}" autocomplete="off">`);
  // Si la lectura habla de una foto ("Read about the photo"), aqui esta:
  // sin ella el ejercicio pedia imaginarsela.
  const foto = `<img class="rphoto" src="../assets/reading-photos/${LEVEL}-${UD.number}-${act.code}.jpg?v=${ART_V}"
                  alt="" onerror="this.remove()">`;
  el.innerHTML = `${foto}${d.box?`<div class="gt-box">${[...d.box].sort(()=>Math.random()-.5).map(w=>`<span>${w}</span>`).join('')}</div>`:''}
    <div class="gt-text">${html}</div>
    <div class="checkrow"><button class="chk">${T("Check","Vérifier")}</button><span class="score"></span></div>`;
  el.querySelector('.chk').onclick = ()=>{
    let ok=0;
    el.querySelectorAll('.gt-text input').forEach(inp=>{
      const good = inp.value.trim().toLowerCase()===d.answers[+inp.dataset.i].toLowerCase();
      inp.className = good?'ok':'bad'; if(good) ok++;
    });
    const s=el.querySelector('.score');
    s.textContent=`${ok} / ${d.answers.length}`;
    s.className='score '+(ok===d.answers.length?'good':'partial');
    if(ok===d.answers.length) complete(act.code);
  };
},

/* ---- spot the difference: dos escenas de emoji ---- */
spot_diff(act, el){
  /* Dos fotos del mismo sitio del campus con los personajes y los objetos
     de la unidad. Se buscan las diferencias pulsando sobre la foto B: hay
     mas de ocho y de tipos distintos (color, tamano, cantidad, sitio, y
     cosas que faltan), que es lo que da pie a hablar en clase.
     Si la unidad todavia no tiene fotos, se usa la rejilla de emoji. */
  const d = act.data;
  const base = `../assets/spot-diff/${LEVEL}-${UD.number}`;

  fetch(base + '-diffs.json?v=' + ART_V).then(r => r.ok ? r.json() : Promise.reject())
    .then(info => pintaFotos(info))
    .catch(() => pintaEmoji());

  function pintaFotos(info){
    const zonas = info.zonas || [];
    el.innerHTML = `
      <p style="margin-top:0"><i>${T('Look at picture A and picture B.','Regarde l\'image A et l\'image B.')}
        ${T('Find and TAP the differences in picture B — there are','Trouve et TOUCHE les différences sur l\'image B — il y en a')} ${zonas.length}!
        ${T('Then tell your partner:','Puis dis à ton camarade :')} <b>"${T('In A the ball is red, but in B it is blue.','Sur A le ballon est rouge, mais sur B il est bleu.')}"</b></i></p>
      <div class="sd-wrap">
        <div class="sd-scene"><h4>A</h4><img class="sd-img" src="${base}-A.jpg?v=${ART_V}" alt=""></div>
        <div class="sd-scene"><h4>B</h4>
          <div class="sd-hot"><img class="sd-img" src="${base}-B.jpg?v=${ART_V}" alt="">
            ${zonas.map((z,i)=>`<button class="sd-z" data-i="${i}"
              style="left:${(z.x*100).toFixed(1)}%;top:${(z.y*100).toFixed(1)}%;
                     width:${(z.r*140).toFixed(1)}%;height:${(z.r*200).toFixed(1)}%"
              aria-label="difference ${i+1}"></button>`).join('')}
          </div></div>
      </div>
      <div class="checkrow"><span class="score">0 / ${zonas.length}</span></div>`;
    let hallados = 0;
    el.querySelectorAll('.sd-z').forEach(b => b.onclick = () => {
      if (b.classList.contains('found')) return;
      b.classList.add('found'); hallados++;
      const sc = el.querySelector('.score');
      sc.textContent = `${hallados} / ${zonas.length}`;
      if (hallados === zonas.length){ sc.className = 'score good'; complete(act.code); }
    });
  }

  function pintaEmoji(){
    if (!d.sceneA) { el.innerHTML = `<p><i>${T('Coming soon.','Bientôt disponible.')}</i></p>`; return; }
    const isDiff = (r,c)=> d.diffs.some(([dr,dc])=>dr===r&&dc===c);
    const grid = scene=>`<div class="sd-grid" style="grid-template-columns:repeat(${scene[0].length},auto)">${
      scene.map((row,r)=>row.map((ch,c)=>`<div class="sd-cell" data-r="${r}" data-c="${c}">${ch}</div>`).join('')).join('')}</div>`;
    el.innerHTML = `<p style="margin-top:0"><i>${T('Look at picture A. Find and TAP the','Regarde l\'image A. Trouve et TOUCHE les')} ${d.diffs.length} ${T('differences in picture B!','différences sur l\'image B !')}</i></p>
      <div class="sd-wrap">
        <div class="sd-scene"><h4>A</h4>${grid(d.sceneA)}</div>
        <div class="sd-scene clickable" id="sdB-${act.code}"><h4>B</h4>${grid(d.sceneB)}</div>
      </div><div class="checkrow"><span class="score">0 / ${d.diffs.length}</span></div>`;
    let found = 0;
    el.querySelectorAll(`#sdB-${act.code} .sd-cell`).forEach(cell=>{
      cell.onclick = ()=>{
        if(cell.classList.contains('found')) return;
        const r=+cell.dataset.r, c=+cell.dataset.c;
        if(isDiff(r,c)){
          cell.classList.add('found'); found++;
          const s=el.querySelector('.score');
          s.textContent=`${found} / ${d.diffs.length}`;
          if(found===d.diffs.length){ s.className='score good'; complete(act.code); }
        } else { cell.classList.add('flash'); setTimeout(()=>cell.classList.remove('flash'),500); }
      };
    });
  }
},

/* ---- exam task ---- */
exam_task(act, el){
  el.classList.add('exam');
  el.innerHTML = `${act.data.text?`<div class="rtext">${act.data.text}<p class="credit">${T('Written by','Texte de')} Paolo Baca</p></div>`:''}
    <p><i>${act.data.instructions}</i></p>
    ${act.data.items.map((it,i)=>`<div class="item" data-i="${i}">
      <div class="stem">${i+1}. ${it.sentence.replace('___','<b>____</b>')}</div>
      <div class="opts">${it.options.map((o,k)=>`<button class="obtn" data-k="${k}">${o}</button>`).join('')}</div>
    </div>`).join('')}
    <div class="checkrow"><button class="chk">${T("Check","Vérifier")}</button><span class="score"></span></div>`;
  el.querySelectorAll('.item').forEach(item=>{
    item.querySelectorAll('.obtn').forEach(b=>b.onclick=()=>{
      item.querySelectorAll('.obtn').forEach(x=>x.classList.remove('sel')); b.classList.add('sel');
    });
  });
  el.querySelector('.chk').onclick=()=>{
    let ok=0;
    el.querySelectorAll('.item').forEach(item=>{
      const it = act.data.items[+item.dataset.i];
      item.querySelectorAll('.obtn').forEach(b=>{
        b.classList.remove('ok','bad');
        if(+b.dataset.k===it.answer && b.classList.contains('sel')){ b.classList.add('ok'); ok++; }
        else if(b.classList.contains('sel')) b.classList.add('bad');
      });
    });
    const s=el.querySelector('.score');
    s.textContent=`${ok} / ${act.data.items.length}`;
    s.className='score '+(ok===act.data.items.length?'good':'partial');
    if(ok===act.data.items.length) complete(act.code);
  };
}
};

(UNIT ? unit() : (LEVEL ? hub() : levels())).catch(e=>{ app.textContent = T('Error loading content: ',"Erreur au chargement du contenu : ")+e.message; });
</script>
