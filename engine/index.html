<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun for Nordic</title>
<script>
/* Los alumnos no deben ver github.io en la barra: si esta copia se abre desde
   GitHub Pages (enlaces/marcadores viejos), salta a nis.cohasset.pe
   conservando ruta, query y hash. En nis.cohasset.pe es un no-op. */
if(/\.github\.io$/i.test(location.hostname)){
  location.replace('https://nis.cohasset.pe'+location.pathname+location.search+location.hash);
}
</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{
    --bg:#f6f9fb; --surface:#fff; --surface2:#eef3f7; --ink:#1b2b3d; --soft:#4a5d70;
    --line:#d7e1e9; --accent:#3b6fb5; --ok:#2f9268; --bad:#cc4b3d; --star:#e0a91f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:1.04rem;line-height:1.5}
  main{max-width:56rem;margin:0 auto;padding:1rem 1rem 5rem}
  h1,h2,h3{font-family:"Baloo 2",sans-serif;text-wrap:balance}
  .band{background:var(--accent);color:#fff;border-radius:14px;padding:1rem 1.4rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
  .band .unum{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.2rem;background:#fff;color:var(--accent);border-radius:12px;padding:0 .8rem;line-height:1.4}
  .band h1{font-size:1.6rem;margin:0;flex:1;min-width:12rem}
  .band .meta{font-size:.8rem;opacity:.9;text-transform:uppercase;letter-spacing:.06em}
  .scene{display:flex;align-items:flex-end;gap:1rem;margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .scene img{height:210px}
  .bubble{position:relative;background:var(--surface2);border-radius:14px;padding:.8rem 1rem;font-weight:600;flex:1}
  .bubble::before{content:"";position:absolute;left:-10px;bottom:18px;border:10px solid transparent;border-right-color:var(--surface2);border-left:0}
  .act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem 1.4rem;margin:1.2rem 0}
  .act h2{display:flex;align-items:center;gap:.6rem;font-size:1.15rem;margin:0 0 .9rem}
  .act .code{background:var(--accent);color:#fff;border-radius:10px;width:2rem;height:2rem;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none}
  .act.done .code{background:var(--ok)}
  button{font-family:"Baloo 2",sans-serif;font-weight:700;font-size:1rem;border:0;border-radius:10px;padding:.55rem 1.2rem;cursor:pointer;background:var(--accent);color:#fff}
  button.secondary{background:var(--surface2);color:var(--ink)}
  button:disabled{opacity:.5;cursor:default}
  .checkrow{display:flex;align-items:center;gap:1rem;margin-top:1rem;flex-wrap:wrap}
  .score{font-weight:700}
  .score.good{color:var(--ok)} .score.partial{color:var(--star)}
  /* crossword */
  .xw{display:flex;gap:1.6rem;flex-wrap:wrap}
  .xw-gridwrap{overflow-x:auto}
  .xw-grid{border-collapse:collapse}
  .xw-grid td{width:2.1rem;height:2.1rem;padding:0;position:relative}
  .xw-grid td.cell{border:1.5px solid var(--soft);background:var(--surface)}
  .xw-grid td.cell input{width:100%;height:100%;border:0;text-align:center;font:700 1.05rem "Source Sans 3";text-transform:uppercase;background:transparent;color:var(--ink);outline-color:var(--accent)}
  .xw-grid td.cell .n{position:absolute;top:1px;left:3px;font-size:.55rem;font-weight:700;color:var(--soft)}
  .xw-grid td.cell.ok{background:#e2f2e9} .xw-grid td.cell.bad{background:#f8e4e1}
  /* palabra entera correcta: se ve al momento, sin pulsar Check */
  .xw-grid td.cell.wok{background:#cdeedd;box-shadow:inset 0 0 0 1.5px var(--ok)}
  .xw-grid td.cell.wok input{color:var(--ok);font-weight:800}
  .xw-clues{flex:1;min-width:16rem;font-size:.95rem}
  .xw-clues h3{margin:.2rem 0 .3rem}
  .xw-clues ol{margin:0 0 .8rem;padding-left:1.4rem}
  .xw-clues li{margin-bottom:.3rem}
  /* match */
  .match{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 2rem;max-width:34rem}
  .match .colh{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:700}
  .mbtn{background:var(--surface2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:.5rem .8rem;font-family:"Source Sans 3";font-weight:600;text-align:left}
  .mbtn.sel{border-color:var(--accent)}
  .mbtn.paired{background:#e2f2e9;color:var(--ok);pointer-events:none}
  .mbtn.flash{border-color:var(--bad)}
  /* listening */
  .lsn .gaps{display:grid;gap:.5rem;margin-top:.8rem;max-width:34rem}
  .lsn label{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  .lsn input{border:1.5px solid var(--line);border-radius:8px;padding:.35rem .6rem;font:600 1rem "Source Sans 3";width:9rem;background:var(--surface);color:var(--ink)}
  .lsn input.ok{border-color:var(--ok);background:#e2f2e9}
  .lsn input.bad{border-color:var(--bad);background:#f8e4e1}
  .playing{background:var(--ok)!important}
  .provisional{font-size:.8rem;color:var(--soft)}
  /* exam */
  .exam .item{margin-bottom:.9rem}
  .exam .stem{font-weight:600;margin-bottom:.35rem}
  .exam .opts{display:flex;gap:.5rem;flex-wrap:wrap}
  .obtn{background:var(--surface2);color:var(--ink);border:2px solid transparent;border-radius:10px;padding:.4rem .9rem;font-family:"Source Sans 3";font-weight:600}
  .obtn.sel{border-color:var(--accent)}
  .obtn.ok{background:#e2f2e9;border-color:var(--ok)}
  .obtn.bad{background:#f8e4e1;border-color:var(--bad)}
  .exam .rtext{background:var(--surface2);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1rem;max-width:44rem}
  /* autoria de las lecturas: son textos propios, no adaptaciones ajenas */
  .credit{margin:.7rem 0 0;font-size:.74rem;font-style:italic;color:var(--soft);
    text-align:right;letter-spacing:.01em}
  /* hub */
  .hub h1{font-size:2rem;margin:.6rem 0}
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem}
  a.ucard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;text-decoration:none;color:var(--ink)}
  a.ucard:hover{border-color:var(--accent)}
  a.ucard .n{font-family:"Baloo 2";font-weight:800;color:var(--accent);font-size:1.3rem}
  a.ucard .stars{color:var(--star);font-size:1.05rem}
  /* celebration */
  #cele{position:fixed;inset:0;background:rgba(27,43,61,.55);display:none;align-items:center;justify-content:center;z-index:9}
  #cele.on{display:flex}
  #cele .box{background:var(--surface);border-radius:18px;padding:2rem 2.6rem;text-align:center;max-width:20rem}
  #cele img{height:230px}
  #cele h2{margin:.4rem 0}
  .crumb{margin:.8rem 0;font-size:.9rem}
  .crumb a{color:var(--accent);font-weight:700;text-decoration:none}
  /* encuentra las diferencias, sobre fotos */
  .sd-wrap{display:flex;gap:1rem;flex-wrap:wrap}
  .sd-scene{flex:1;min-width:min(100%,20rem)}
  .sd-scene h4{margin:0 0 .3rem;font-family:"Baloo 2";color:var(--accent)}
  .sd-img{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:12px}
  .sd-hot{position:relative}
  .sd-z{position:absolute;transform:translate(-50%,-50%);background:transparent;
    border:2px dashed transparent;border-radius:50%;padding:0;cursor:pointer}
  .sd-z:hover{border-color:rgba(59,111,181,.5)}
  .sd-z.found{border-color:var(--ok);background:rgba(47,146,104,.22)}
  .demoflag{margin:1.4rem 0 .2rem;background:#fff6e0;border:1px solid #e8cf94;
    border-left:6px solid var(--star);border-radius:12px;padding:.75rem 1rem;
    font-size:.92rem;color:#6b5313}
  /* opener: texto de introduccion + panel ilustrado */
  .opener{display:flex;flex-direction:column;gap:1rem;margin:1.2rem 0}
  .op-text{width:100%;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:14px;padding:1.1rem 1.3rem}
  .op-text h3{margin:0 0 .4rem;color:var(--accent);font-size:1.05rem}
  .op-text p{margin:0;line-height:1.65}
  .op-art{width:100%;background:linear-gradient(160deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);place-items:center;padding:.8rem;gap:.2rem}
  .op-art span{font-size:3.2rem;line-height:1.25}
  .op-art.op-photo{display:block;padding:0;overflow:hidden}
  .op-art.op-photo img{width:100%;height:100%;min-height:12rem;object-fit:cover;display:block;border-radius:13px}
  /* escena dibujada a medida: es SVG, no se recorta como una foto */
  .op-art.op-drawn{background:none;border:0;padding:0}
  .op-art.op-drawn svg{width:100%;height:auto;display:block;border-radius:13px;
    border:1px solid var(--line)}
  .campus-banner{margin:0 0 1.4rem;border-radius:18px;overflow:hidden;border:1px solid var(--line)}
  .campus-banner img{width:100%;max-height:260px;object-fit:cover;display:block}
  /* picture words */
  .pwrow{display:flex;flex-wrap:wrap;gap:.7rem;margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .pwrow .pw{position:relative;width:11rem;text-align:center;background:var(--surface2);
    border:2px solid transparent;border-radius:12px;padding:.5rem .2rem .4rem;cursor:pointer;
    font-family:"Source Sans 3",system-ui,sans-serif;color:var(--ink);
    transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
  .pwrow .pw:hover{border-color:var(--accent);transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(59,111,181,.16)}
  .pwrow .pw:active{transform:translateY(0) scale(.97)}
  .pwrow .pw.saying{border-color:var(--ok);background:#e2f2e9}
  .pwrow .pw .ico{line-height:1.2;display:flex;align-items:center;justify-content:center;height:7rem}
  .pwrow .pw .ico svg{width:7rem;height:7rem;display:block}
  .pwrow .pw .ico img.art3d{width:7rem;height:7rem;object-fit:contain;display:block}
  .pwrow .pw .ico .emo{font-size:5.2rem}
  .pwrow .pw .spk{position:absolute;top:.25rem;right:.35rem;font-size:.72rem;opacity:0;transition:opacity .12s}
  .pwrow .pw:hover .spk,.pwrow .pw.saying .spk{opacity:.75}
  @media (prefers-reduced-motion:reduce){.pwrow .pw{transition:none}.pwrow .pw:hover{transform:none}}
  .pwrow .pw .w{font-size:1rem;font-weight:700;margin-top:.15rem}
  /* gap text */
  .gt-box{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.9rem}
  .gt-box span{background:var(--surface2);border-radius:8px;padding:.25rem .7rem;font-weight:700;font-size:.95rem}
  .gt-text{background:var(--surface2);border-radius:10px;padding:1rem 1.2rem;max-width:46rem;line-height:2.1}
  .gt-text input{border:0;border-bottom:2px solid var(--accent);background:transparent;font:600 1rem "Source Sans 3";width:7.5rem;text-align:center;color:var(--ink)}
  .gt-text input.ok{color:var(--ok);border-color:var(--ok)}
  .gt-text input.bad{color:var(--bad);border-color:var(--bad)}
  .gt-text .gn{font-size:.7rem;color:var(--soft);font-weight:700;vertical-align:super}
  /* spot the difference */
  .sd-wrap{display:flex;gap:1.4rem;flex-wrap:wrap}
  .sd-scene{border:2px solid var(--line);border-radius:12px;padding:.5rem;background:#eef7fb}
  .sd-scene h4{margin:.1rem 0 .3rem;text-align:center;font-family:"Baloo 2"}
  .sd-grid{display:grid;gap:2px}
  .sd-cell{width:3.4rem;height:3.4rem;display:flex;align-items:center;justify-content:center;font-size:2.1rem;background:#fff;border-radius:8px}
  .sd-scene.clickable .sd-cell{cursor:pointer}
  .sd-cell.found{background:#e2f2e9;outline:3px solid var(--ok)}
  .sd-cell.flash{outline:3px solid var(--bad)}
  /* video guia de la mascota */
  .guide{margin:1.2rem 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
  .guide h2{margin:0 0 .8rem;font-size:1.15rem}
  .guide video{width:100%;max-width:46rem;border-radius:12px;display:block;margin:0 auto;background:var(--surface2)}
  .guide h2{text-align:center}
  /* portada de niveles */
  .lvcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1.2rem}
  .lvcard{display:flex;flex-direction:column;align-items:center;gap:.3rem;text-decoration:none;color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--lv);border-radius:16px;padding:1.4rem 1rem 1.2rem}
  .lvcard:hover{border-color:var(--lv)}
  .lvcard img{height:180px;margin-bottom:.4rem}
  .lvcard b{font-family:"Baloo 2";font-size:1.25rem;color:var(--lv)}
  .lvcard .exam{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);font-weight:700}
  .lvcard .cast{font-size:.9rem;color:var(--soft)}
</style>
</head>
<body>
<!-- Splash de marca. La ruta relativa vale igual servido desde
     nis.cohasset.pe/nis-fun/ que desde GitHub Pages. Con data-key propia
     sale al abrir el curso aunque ya se hubiera visto en el portal (mismo
     origen, misma sessionStorage); sigue siendo una vez por sesion, asi
     que no reaparece al abrir cada una de las 45-55 unidades. -->
<script src="../nis-splash.js?v=4" data-key="nis_splash_curso"></script>
<script src="crossword-layout.js"></script>
<script src="emoji-map.js"></script>
<script src="vocab-art.js?v=1"></script>
<main id="app">Loading…</main>
<div id="cele"><div class="box"><img id="cele-img" alt=""><h2>Well done!</h2><p id="cele-msg"></p><button onclick="document.getElementById('cele').classList.remove('on')">OK</button></div></div>
<script>
const qs = new URLSearchParams(location.search);
const LEVEL = qs.get('level');
const UNIT = qs.get('unit');
const app = document.getElementById('app');
const COLORS = { starters:'#d97d0d', movers:'#2f9268', flyers:'#3b6fb5' };
// Escapa el texto que va dentro de un atributo (las palabras del wordlist
// llevan apostrofes: chemist's).
// Modo demostracion (?demo=1): solo las dos primeras unidades de cada nivel,
// con un aviso visible. Sirve para ensenar el curso sin abrir las 150.
const DEMO = new URLSearchParams(location.search).get('demo') === '1';
const Q = extra => (DEMO ? extra + '&demo=1' : extra);

const esc = t => String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;')
                          .replace(/</g,'&lt;').replace(/>/g,'&gt;');
// El servidor cachea los mp4 4 horas y la ruta no cambia al reemplazarlos:
// subir esta fecha obliga al navegador a volver a bajarlos.
const VIDEO_V = '2026-08-25-marca';
if (COLORS[LEVEL]) document.documentElement.style.setProperty('--accent', COLORS[LEVEL]);
const CHAR = (slug, pose) => `../assets/characters/${LEVEL}/${slug}/pose-${String(pose).padStart(2,'0')}.png`;
// si no existe el PNG (arte 3D), cae al SVG plano provisional
const FB = `onerror="this.onerror=null;this.src=this.src.replace('.png','.svg')"`;
const store = {
  key: (u)=>`nisfun-${LEVEL}-u${u}`,
  get(u){ try{return JSON.parse(localStorage.getItem(this.key(u))||'{}')}catch(e){return{}} },
  set(u,d){ localStorage.setItem(this.key(u), JSON.stringify(d)) }
};

async function j(path){ const r = await fetch(path); if(!r.ok) throw new Error(path); return r.json(); }

/* ---------------- PORTADA: los 3 niveles ---------------- */
async function levels(){
  const data = await j('../content/levels.json');
  document.title = 'Fun for Nordic';
  app.innerHTML = `
    <h1 style="font-size:2.2rem;margin:1.4rem 0 .2rem">Fun for Nordic</h1>
    <p style="color:var(--soft);margin:0 0 1.4rem">Cambridge Young Learners · Nordic International School</p>
    <div class="campus-banner"><img src="../assets/scenes/main-building.jpg" alt="Nordic campus"></div>
    <div class="lvcards">${data.levels.map(l=>`
      <a class="lvcard" href="${Q(`?level=${l.id}`)}" style="--lv:${l.color}">
        <img src="../assets/characters/${l.id}/${l.mascot}/pose-01.png"
             onerror="this.onerror=null;this.src=this.src.replace('.png','.svg')" alt="">
        <b>${l.name}</b>
        <span class="exam">${l.exam}</span>
        <span class="cast">${l.cast}</span>
      </a>`).join('')}</div>`;
}

/* ---------------- HUB ---------------- */
async function hub(){
  const idx = await j(`../content/${LEVEL}/index.json`);
  document.title = idx.name;
  app.classList.add('hub');
  app.innerHTML = `
    <div class="crumb"><a href="${Q(`?`)}">← Fun for Nordic</a></div>
    <div class="band"><img src="${CHAR(idx.mascot,1)}" style="height:150px" alt="" ${FB}>
      <h1>${idx.name}</h1><span class="meta">${idx.cast}</span></div>
    <div class="guide" id="guide">
      <h2>🎬 Meet ${idx.mascot[0].toUpperCase()+idx.mascot.slice(1)} — your guide!</h2>
      <video controls preload="metadata" src="../assets/videos/${idx.mascot}-intro.mp4?v=${VIDEO_V}"
        poster="../assets/videos/posters/${idx.mascot}-intro.jpg?v=${VIDEO_V}"
        onerror="document.getElementById('guide').remove()"></video>
    </div>
    <div class="guide" id="team">
      <h2>⭐ Meet the team — ${idx.cast}!</h2>
      <video controls preload="metadata" src="../assets/videos/${LEVEL}-cast.mp4?v=${VIDEO_V}"
        poster="../assets/videos/posters/${LEVEL}-cast.jpg?v=${VIDEO_V}"
        onerror="document.getElementById('team').remove()"></video>
    </div>
    ${DEMO ? `<div class="demoflag">Demonstration — this preview covers the first two units of each book. The full course has ${idx.units.length} units.</div>` : ''}
    <h2 style="margin:1.4rem 0 .8rem">Units</h2>
    <div class="units">${(DEMO ? idx.units.slice(0,2) : idx.units).map(u=>{
      const p = store.get(u.n);
      const done = p.done ? Object.keys(p.done).length : 0;
      return `<a class="ucard" href="${Q(`?level=${LEVEL}&unit=${u.n}`)}">
        <span class="n">${u.n}</span> <b>${u.title}</b><br>
        <small>${u.topic}</small><br>
        <span class="stars">${'★'.repeat(done)}${'☆'.repeat(Math.max(0,4-done))}</span></a>`;
    }).join('')}</div>`;
}

/* ---------------- UNIT ---------------- */
let UD, PROG;
function makeIntro(ud){
  if (ud.scene && ud.scene.intro) return ud.scene.intro;
  const cap = n => n.charAt(0).toUpperCase()+n.slice(1);
  const c1 = cap(ud.characters[0]||''), c2 = cap(ud.characters[1]||c1);
  if (LEVEL==='starters') return `Hello, explorers! Today ${c1} and ${c2} are playing with the world of ${ud.topic}. Look at the big pictures, say every new word out loud and listen to the story with your best ears. Pip is hiding somewhere in this unit too! When you finish all the games, you win a star. Ready, explorers? One, two, three… let's go!`;
  if (LEVEL==='movers') return `Welcome back, Fjord Club! In this unit, ${c1} and ${c2} discover the world of ${ud.topic}. First learn the picture words, then read carefully and listen to your friends — the answers are always hiding in the story. You will also practise ${ud.grammar}. Luna is watching and she only barks for good answers. The adventure starts now!`;
  return `The Aurora Expedition continues! This time, ${c1} and ${c2} take you deep into the world of ${ud.topic}. Read the texts slowly, listen twice like in the real exam, and use ${ud.grammar} like a true explorer. Every activity you finish takes you one step closer to the Flyers exam — and Kili is carrying a star with your name on it. Good luck, explorer!`;
}
function sceneFor(ud){
  const t = ((ud.topic||'')+' '+(ud.title||'')+' '+(ud.grammar||'')).toLowerCase();
  const has = (...ws)=>ws.some(w=>t.includes(w));
  // Deporte y movimiento
  if (has('hockey','sport','football','match','team','ball','game of')) return 'hockey';
  if (has('run','athletic','exercise','race','fit','body','face','health','hair','tall','strong')) return 'track';
  // Palabras y letras
  if (has('librar','book','read','stor','writ','letter','spell','alphabet','biograph','diary','note')) return 'library';
  // Aula: lo escolar y la gramatica que no tiene mundo propio
  if (has('school','classroom','lesson','subject','timetable','homework','study','exam','test','practice','teacher','pencil','material')) return 'classroom';
  // Mirador: mar, cielo, clima, mundo
  if (has('beach','sea','ocean','island','boat','fish','swim','sail','geograph','space','sky','star','planet','world','country','weather','season','rain','snow','sunny','cloud','wind','storm')) return 'mirador';
  // Picnic: comida y celebraciones de mesa
  if (has('food','fruit','vegetable','eat','drink','breakfast','lunch','dinner','picnic','meal','snack','cook','hungry','thirst','cake','kitchen')) return 'picnic-garden';
  // Huerto: naturaleza y animales
  if (has('garden','plant','flower','tree','farm','countryside','nature','grow','animal','pet','bird','insect','zoo')) return 'garden';
  // Plaza del ajedrez: numeros, cantidades y comparaciones
  if (has('number','count','math','quantit','compar','superlativ','measure','money','price','how many','how much','more','most','less')) return 'chess-plaza';
  // Fachada: la ciudad, la casa, el trabajo, los viajes
  if (has('town','city','place','building','street','direction','way','map','shop','buy','work','job','travel','transport','holiday','trip','home','house','room','bedroom','furniture','chore','clean','live','clothes','wear')) return 'facade';
  // Entrada: la gente
  if (has('hello','welcome','greet','friend','family','people','person','name','telephone','phone','feel','happy','sad','personal','who')) return 'entrance';
  // Anfiteatro: fiesta, musica y repaso
  if (has('review','party','celebrat','music','show','concert','birthday','danc','sing','hobb','free time','screen')) return 'amphitheater';
  // Laberinto: juego y posicion
  if (has('game','play','toy','prepos','position','where is','behind','between','hide')) return 'labyrinth';
  // Tiempo y rutina
  if (has('time','clock','hour','day','week','month','routine','morning','afternoon','night','often','always','frequen')) return 'campus-hex';
  // Sin tema propio (gramatica pura): se reparte por numero de unidad para
  // que ninguna pagina quede sin ilustracion y no salga siempre la misma.
  const pool = ['campus-hex','chess-plaza','amphitheater','entrance','facade','labyrinth','mirador','classroom'];
  return pool[(Number(ud.number)||0) % pool.length];
}

/* ---- pronunciacion de las picture words -----------------------------
   Un mp3 grabado por palabra (audio/words/*.mp3, voz unica para todo el
   vocabulario). Si falta el archivo o el navegador no lo puede reproducir,
   cae a la voz del sistema, que siempre esta.                          */
const SAY = {
  cache: {},
  slug(w){ return String(w).toLowerCase().replace(/'/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); },
  voz(w){
    if (!window.speechSynthesis) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(w);
      u.lang = 'en-GB'; u.rate = 0.85;
      speechSynthesis.speak(u);
    } catch(e){}
  },
  play(w, btn){
    const done = () => btn && btn.classList.remove('saying');
    btn && btn.classList.add('saying');
    const src = '../audio/words/' + this.slug(w) + '.mp3';
    let a = this.cache[src];
    if (!a){ a = this.cache[src] = new Audio(src); a.preload = 'auto'; }
    a.currentTime = 0;
    a.onended = done;
    a.onerror = () => { this.voz(w); setTimeout(done, 700); };
    const pr = a.play();
    if (pr && pr.catch) pr.catch(() => { this.voz(w); setTimeout(done, 700); });
  }
};

function wirePictureWords(){
  document.querySelectorAll('.pwrow .pw[data-say]').forEach(btn => {
    btn.addEventListener('click', () => SAY.play(btn.dataset.say, btn));
  });
}

function complete(code, msg){
  if(!PROG.done[code]){ PROG.done[code]=true; store.set(UD.number, PROG); }
  document.getElementById('act-'+code).classList.add('done');
  const total = UD.activities.filter(a=>a.outputs.includes('digital')).length;
  const done = Object.keys(PROG.done).length;
  const c = document.getElementById('cele');
  const ci = document.getElementById('cele-img'); ci.onerror = ()=>{ ci.onerror=null; ci.src = ci.src.replace('.png','.svg'); }; ci.src = CHAR(UD.characters[0],10);
  document.getElementById('cele-msg').textContent = done>=total
    ? `You have finished Unit ${UD.number}! ⭐⭐⭐⭐`
    : msg || `Activity complete! (${done}/${total})`;
  c.classList.add('on');
}

const RENDER = {

/* ---- crossword ---- */
crossword(act, el){
  const words = act.data.words[0].row !== undefined ? act.data.words : layoutCrossword(act.data.words);
  let R=0,C=0; const cells={};
  words.forEach(w=>{ [...w.word].forEach((ch,i)=>{
    const r=w.row+(w.dir==='down'?i:0), c=w.col+(w.dir==='across'?i:0);
    cells[r+','+c]=ch; R=Math.max(R,r+1); C=Math.max(C,c+1); });});
  const starts=[...new Set(words.map(w=>w.row+','+w.col))]
    .sort((a,b)=>{const[ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc});
  const num=p=>starts.indexOf(p)+1;
  let g='<table class="xw-grid">';
  for(let r=0;r<R;r++){ g+='<tr>';
    for(let c=0;c<C;c++){ const k=r+','+c;
      g += cells[k]!==undefined
        ? `<td class="cell" data-k="${k}">${starts.includes(k)?`<span class="n">${num(k)}</span>`:''}<input maxlength="1" data-k="${k}"></td>`
        : '<td></td>'; }
    g+='</tr>'; }
  g+='</table>';
  const list=d=>`<ol>${words.filter(w=>w.dir===d)
    .map(w=>({n:num(w.row+','+w.col),w}))
    .sort((a,b)=>a.n-b.n)
    .map(({n,w})=>`<li value="${n}">${w.clue} <small>(${w.word.length})</small></li>`).join('')}</ol>`;
  el.innerHTML = `<div class="xw"><div class="xw-gridwrap">${g}</div>
    <div class="xw-clues"><h3>Across ➜</h3>${list('across')}<h3>Down ⬇</h3>${list('down')}</div></div>
    <div class="checkrow"><button>Check</button><span class="score"></span></div>`;

  /* ---- escribir de corrido y ver la palabra en verde ----------------
     Sin esto hay que pinchar casilla por casilla, que con ninos pequenos
     es media clase perdida. Al teclear una letra el foco salta solo a la
     siguiente casilla de la palabra, y en cuanto una palabra queda bien
     escrita se pinta entera de verde sin esperar al boton Check.       */
  const inp = k => el.querySelector(`input[data-k="${k}"]`);
  const celdasDe = w => [...w.word].map((_, i) =>
    (w.row + (w.dir === 'down' ? i : 0)) + ',' + (w.col + (w.dir === 'across' ? i : 0)));

  // en que palabras entra cada casilla, para saber hacia donde avanzar
  const porCelda = {};
  words.forEach(w => celdasDe(w).forEach((k, i) => {
    (porCelda[k] = porCelda[k] || []).push({ w, i });
  }));

  let dir = 'across';                     // direccion en la que se avanza

  function pintaPalabras(){
    el.querySelectorAll('td.cell').forEach(td => td.classList.remove('wok'));
    words.forEach(w => {
      const ks = celdasDe(w);
      const bien = ks.every(k => ((inp(k) || {}).value || '').toUpperCase() === cells[k]);
      if (bien) ks.forEach(k => inp(k).closest('td').classList.add('wok'));
    });
    // todas las palabras resueltas = actividad hecha
    const todo = Object.keys(cells).every(k => ((inp(k) || {}).value || '').toUpperCase() === cells[k]);
    if (todo) {
      const s = el.querySelector('.score');
      s.textContent = 'All correct!'; s.className = 'score good';
      complete(act.code);
    }
  }

  el.querySelectorAll('td.cell input').forEach(i => {
    i.addEventListener('focus', () => {
      const ent = porCelda[i.dataset.k] || [];
      // si la casilla solo pertenece a una palabra, se sigue esa direccion
      if (ent.length === 1) dir = ent[0].w.dir;
    });
    i.addEventListener('input', () => {
      i.value = (i.value || '').toUpperCase().slice(0, 1);
      pintaPalabras();
      if (!i.value) return;
      const ent = (porCelda[i.dataset.k] || []).find(e => e.w.dir === dir)
               || (porCelda[i.dataset.k] || [])[0];
      if (!ent) return;
      const ks = celdasDe(ent.w);
      const sig = inp(ks[ent.i + 1]);
      if (sig) { sig.focus(); sig.select(); }
    });
    i.addEventListener('keydown', ev => {
      const ent = (porCelda[i.dataset.k] || []).find(e => e.w.dir === dir)
               || (porCelda[i.dataset.k] || [])[0];
      if (!ent) return;
      const ks = celdasDe(ent.w);
      if (ev.key === 'Backspace' && !i.value) {          // volver atras al borrar
        const ant = inp(ks[ent.i - 1]);
        if (ant) { ev.preventDefault(); ant.focus(); ant.value = ''; pintaPalabras(); }
      }
      if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft' ||
          ev.key === 'ArrowUp' || ev.key === 'ArrowDown') {
        const d = (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') ? 'across' : 'down';
        const paso = (ev.key === 'ArrowRight' || ev.key === 'ArrowDown') ? 1 : -1;
        const [r, c] = i.dataset.k.split(',').map(Number);
        const k2 = d === 'across' ? r + ',' + (c + paso) : (r + paso) + ',' + c;
        const sig = inp(k2);
        if (sig) { ev.preventDefault(); dir = d; sig.focus(); sig.select(); }
      }
    });
  });

  el.querySelector('button').onclick = ()=>{
    let ok=0, tot=0;
    el.querySelectorAll('td.cell').forEach(td=>{ tot++;
      const k=td.dataset.k, v=(td.querySelector('input').value||'').toUpperCase();
      td.classList.remove('ok','bad');
      if(v===cells[k]){ td.classList.add('ok'); ok++; } else if(v) td.classList.add('bad'); });
    const s=el.querySelector('.score');
    s.textContent = `${ok} / ${tot} letters`;
    s.className = 'score '+(ok===tot?'good':'partial');
    pintaPalabras();
    if(ok===tot) complete(act.code);
  };
},

/* ---- match (con distractores opcionales en data.extra) ---- */
match_words(act, el){
  const pairs = act.data.pairs;
  const rights = pairs.map(p=>p.right).concat(act.data.extra||[]).sort(()=>Math.random()-.5);
  const rows = Math.max(pairs.length, rights.length);
  let grid = `<span class="colh">${act.data.left_label||''}</span><span class="colh">${act.data.right_label||''}</span>`;
  for(let i=0;i<rows;i++){
    grid += pairs[i] ? `<button class="mbtn l" data-v="${pairs[i].left}">${pairs[i].left}</button>` : `<span></span>`;
    grid += rights[i]!==undefined ? `<button class="mbtn r" data-v="${rights[i]}">${rights[i]}</button>` : `<span></span>`;
  }
  el.innerHTML = `${act.data.extra?`<p style="margin-top:0"><i>Careful — one answer is extra and matches nothing!</i></p>`:''}
    <div class="match">${grid}</div><div class="checkrow"><span class="score"></span></div>`;
  let sel=null, matched=0, tries=0;
  const map=Object.fromEntries(pairs.map(p=>[p.left,p.right]));
  el.querySelectorAll('.mbtn.l').forEach(b=>b.onclick=()=>{ el.querySelectorAll('.mbtn.l').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=b; });
  el.querySelectorAll('.mbtn.r').forEach(b=>b.onclick=()=>{
    if(!sel) return; tries++;
    if(map[sel.dataset.v]===b.dataset.v){
      sel.classList.add('paired'); b.classList.add('paired'); sel.classList.remove('sel'); sel=null; matched++;
      el.querySelector('.score').textContent=`${matched} / ${pairs.length}`;
      if(matched===pairs.length){ el.querySelector('.score').className='score good'; complete(act.code); }
    } else { b.classList.add('flash'); setTimeout(()=>b.classList.remove('flash'),500); }
  });
},

/* ---- listening ---- */
listening(act, el){
  el.classList.add('lsn');
  el.innerHTML = `<div class="checkrow">
      <button class="play">▶ Listen</button>
      <span class="provisional"></span></div>
    <div class="gaps">${act.data.questions.map((q,i)=>
      `<label>${i+1}. ${q.q.replace('…','<b>…</b>')} <input data-i="${i}" autocomplete="off"></label>`).join('')}</div>
    <div class="checkrow"><button class="chk">Check</button><span class="score"></span></div>`;
  const playBtn = el.querySelector('.play');
  const audio = new Audio(`../audio/${act.audio}`);
  let mode='mp3', speaking=false;
  audio.onerror = ()=>{ mode='tts'; el.querySelector('.provisional').textContent='(temporary browser voice — the real audio is coming soon)'; };
  playBtn.onclick = ()=>{
    if(mode==='mp3' && !audio.error){ audio.paused ? (audio.play(), playBtn.textContent='⏸ Pause') : (audio.pause(), playBtn.textContent='▶ Listen'); return; }
    if(speaking){ speechSynthesis.cancel(); speaking=false; playBtn.textContent='▶ Listen'; playBtn.classList.remove('playing'); return; }
    const parts = act.data.script.split('…');
    speechSynthesis.cancel();
    const voices = speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'));
    parts.forEach((p,i)=>{
      const u = new SpeechSynthesisUtterance(p.replace(/^[^:]+:/,'').trim());
      u.lang='en-GB'; u.rate=.92;
      if(voices.length) u.voice = voices[i%2] || voices[0];
      if(i===parts.length-1) u.onend=()=>{ speaking=false; playBtn.textContent='▶ Listen'; playBtn.classList.remove('playing'); };
      speechSynthesis.speak(u);
    });
    speaking=true; playBtn.textContent='⏹ Stop'; playBtn.classList.add('playing');
  };
  el.querySelector('.chk').onclick = ()=>{
    let ok=0;
    el.querySelectorAll('.gaps input').forEach(inp=>{
      const good = inp.value.trim().toLowerCase()===act.data.questions[+inp.dataset.i].answer.toLowerCase();
      inp.className = good?'ok':'bad'; if(good) ok++;
    });
    const s=el.querySelector('.score');
    s.textContent=`${ok} / ${act.data.questions.length}`;
    s.className='score '+(ok===act.data.questions.length?'good':'partial');
    if(ok===act.data.questions.length) complete(act.code);
  };
},

/* ---- spot the difference: dos escenas de emoji ---- */
spot_diff(act, el){
  /* Dos fotos del mismo sitio del campus con los personajes y los objetos
     de la unidad. Se buscan las diferencias pulsando sobre la foto B: hay
     mas de ocho y de tipos distintos (color, tamano, cantidad, sitio, y
     cosas que faltan), que es lo que da pie a hablar en clase.
     Si la unidad todavia no tiene fotos, se usa la rejilla de emoji. */
  const d = act.data;
  const base = `../assets/spot-diff/${LEVEL}-${UD.number}`;

  fetch(base + '-diffs.json').then(r => r.ok ? r.json() : Promise.reject())
    .then(info => pintaFotos(info))
    .catch(() => pintaEmoji());

  function pintaFotos(info){
    const zonas = info.zonas || [];
    el.innerHTML = `
      <p style="margin-top:0"><i>Look at picture A and picture B.
        Find and TAP the differences in picture B — there are ${zonas.length}!
        Then tell your partner: <b>"In A the ball is red, but in B it is blue."</b></i></p>
      <div class="sd-wrap">
        <div class="sd-scene"><h4>A</h4><img class="sd-img" src="${base}-A.jpg" alt=""></div>
        <div class="sd-scene"><h4>B</h4>
          <div class="sd-hot"><img class="sd-img" src="${base}-B.jpg" alt="">
            ${zonas.map((z,i)=>`<button class="sd-z" data-i="${i}"
              style="left:${(z.x*100).toFixed(1)}%;top:${(z.y*100).toFixed(1)}%;
                     width:${(z.r*140).toFixed(1)}%;height:${(z.r*200).toFixed(1)}%"
              aria-label="difference ${i+1}"></button>`).join('')}
          </div></div>
      </div>
      <div class="checkrow"><span class="score">0 / ${zonas.length}</span></div>`;
    let hallados = 0;
    el.querySelectorAll('.sd-z').forEach(b => b.onclick = () => {
      if (b.classList.contains('found')) return;
      b.classList.add('found'); hallados++;
      const sc = el.querySelector('.score');
      sc.textContent = `${hallados} / ${zonas.length}`;
      if (hallados === zonas.length){ sc.className = 'score good'; complete(act.code); }
    });
  }

  function pintaEmoji(){
    if (!d.sceneA) { el.innerHTML = '<p><i>Coming soon.</i></p>'; return; }
    const isDiff = (r,c)=> d.diffs.some(([dr,dc])=>dr===r&&dc===c);
    const grid = scene=>`<div class="sd-grid" style="grid-template-columns:repeat(${scene[0].length},auto)">${
      scene.map((row,r)=>row.map((ch,c)=>`<div class="sd-cell" data-r="${r}" data-c="${c}">${ch}</div>`).join('')).join('')}</div>`;
    el.innerHTML = `<p style="margin-top:0"><i>Look at picture A. Find and TAP the ${d.diffs.length} differences in picture B!</i></p>
      <div class="sd-wrap">
        <div class="sd-scene"><h4>A</h4>${grid(d.sceneA)}</div>
        <div class="sd-scene clickable" id="sdB-${act.code}"><h4>B</h4>${grid(d.sceneB)}</div>
      </div><div class="checkrow"><span class="score">0 / ${d.diffs.length}</span></div>`;
    let found = 0;
    el.querySelectorAll(`#sdB-${act.code} .sd-cell`).forEach(cell=>{
      cell.onclick = ()=>{
        if(cell.classList.contains('found')) return;
        const r=+cell.dataset.r, c=+cell.dataset.c;
        if(isDiff(r,c)){
          cell.classList.add('found'); found++;
          const s=el.querySelector('.score');
          s.textContent=`${found} / ${d.diffs.length}`;
          if(found===d.diffs.length){ s.className='score good'; complete(act.code); }
        } else { cell.classList.add('flash'); setTimeout(()=>cell.classList.remove('flash'),500); }
      };
    });
  }
},

    const s=el.querySelector('.score');
    s.textContent=`${ok} / ${act.data.items.length}`;
    s.className='score '+(ok===act.data.items.length?'good':'partial');
    if(ok===act.data.items.length) complete(act.code);
  };
}
};

(UNIT ? unit() : (LEVEL ? hub() : levels())).catch(e=>{ app.textContent = 'Error loading content: '+e.message; });
</script>
</body>
</html>
