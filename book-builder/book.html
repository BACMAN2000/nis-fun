<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Fun for Nordic — Student's Book</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{ --accent:#3b6fb5; --ink:#1b2b3d; --soft:#4a5d70; --line:#c9d5e0; --band:#e8eff7; }
  *{box-sizing:border-box; -webkit-print-color-adjust:exact; print-color-adjust:exact}
  body{margin:0;font-family:"Source Sans 3",sans-serif;color:var(--ink);font-size:10.5pt;line-height:1.45;background:#fff}
  .page{width:210mm;min-height:297mm;padding:14mm 16mm 12mm;margin:0 auto;page-break-after:always;position:relative;display:flex;flex-direction:column}
  h1,h2{font-family:"Baloo 2",sans-serif}
  .band{background:var(--accent);color:#fff;border-radius:5mm;padding:3mm 6mm;display:flex;align-items:center;gap:5mm}
  .band .n{background:#fff;color:var(--accent);font-family:"Baloo 2";font-weight:800;font-size:18pt;border-radius:3mm;padding:0 3.5mm}
  .band h1{font-size:16pt;margin:0;flex:1}
  .band .focus{font-size:7pt;text-transform:uppercase;letter-spacing:.06em;opacity:.9;text-align:right}
  .scene{display:flex;align-items:flex-end;gap:4mm;margin:5mm 0}
  .scene img{height:32mm}
  .bubble{background:var(--band);border-radius:4mm;padding:3mm 4mm;font-weight:600;flex:1;font-size:10pt}
  /* Cada actividad entera en la misma pagina. La unidad va en un solo
     .page y, cuando el contenido pasa de 297 mm, el navegador reparte por
     donde caiga: sin esto los crucigramas y los emparejamientos salian
     cortados entre dos hojas. Con break-inside la actividad completa baja
     a la hoja siguiente. */
  .act{margin:4mm 0;break-inside:avoid;page-break-inside:avoid}
  /* que el titulo no se quede solo al pie */
  .act h2{break-after:avoid;page-break-after:avoid}
  /* y los bloques que nunca deben partirse por dentro */
  .xw, .picwords, .match, .lsn-lines, .exam .rtext, .exam .item,
  .writelines, .scene, .op-text{break-inside:avoid;page-break-inside:avoid}
  .act h2{font-size:11.5pt;margin:0 0 2.5mm;display:flex;gap:2.5mm;align-items:center}
  .act .code{background:var(--accent);color:#fff;border-radius:2.5mm;width:6.5mm;height:6.5mm;display:inline-flex;align-items:center;justify-content:center;font-size:10pt;flex:none}
  /* crossword print */
  .xw{display:flex;gap:8mm}
  .xw table{border-collapse:collapse}
  .xw td{width:7mm;height:7mm;position:relative}
  .xw td.cell{border:.4mm solid var(--soft)}
  .xw td.cell .n{position:absolute;top:.2mm;left:.8mm;font-size:5pt;font-weight:700;color:var(--soft)}
  .clues{flex:1;font-size:9pt}
  .clues h3{font-family:"Baloo 2";margin:0 0 1mm;font-size:9.5pt}
  .clues ol{margin:0 0 3mm;padding-left:5mm}
  .clues li{margin-bottom:1mm}
  /* match print */
  .mt{display:grid;grid-template-columns:auto auto;gap:1.5mm 24mm;width:fit-content}
  .mt span{border:.35mm solid var(--line);border-radius:2mm;padding:1mm 4mm;font-weight:600;font-size:9.5pt}
  .mt .colh{border:0;font-size:7pt;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);font-weight:700;padding:0 4mm}
  /* exam print */
  .exam .rtext{background:var(--band);border-radius:3mm;padding:3mm 4mm;margin-bottom:2.5mm;font-size:9.5pt}
  .credit{margin:2mm 0 0;font-size:7pt;font-style:italic;color:#6b7b8c;text-align:right}
  /* escena de apertura: foto del campus o escena dibujada de la unidad */
  img.op-art{width:100%;height:33mm;object-fit:cover;border-radius:2mm;display:block}
  .op-art.op-drawn{width:100%;border-radius:2mm;overflow:hidden;line-height:0}
  .op-art.op-drawn svg{width:100%;height:auto;display:block}
  .picwords .pw .ico svg{width:13mm;height:13mm;display:block;margin:0 auto}
  .picwords .pw .ico img.art3d{width:13mm;height:13mm;object-fit:contain;display:block;margin:0 auto}
  .picwords .pw .ico .emo{font-size:13mm}
  .exam .item{margin-bottom:2mm;font-size:9.5pt}
  .exam .opts{display:inline}
  .exam .opt{display:inline-block;margin-left:4mm}
  .exam .opt::before{content:"○ "}
  .pair{background:var(--band);border-radius:3mm;padding:3mm 4mm;font-size:9.5pt}
  .wordlist{margin-top:auto;border-top:.5mm solid var(--accent);padding-top:2mm;font-size:8.5pt;color:var(--soft)}
  .wordlist b{color:var(--accent);font-family:"Baloo 2"}
  .pageno{position:absolute;bottom:6mm;right:16mm;font-family:"Baloo 2";font-weight:700;color:var(--accent)}
  /* workbook */
  .wb-words{display:grid;grid-template-columns:1fr 1fr;gap:2mm 8mm;margin:3mm 0}
  .wb-words div{display:flex;gap:3mm;align-items:baseline;font-size:10pt}
  .wb-words b{min-width:26mm;font-weight:600}
  .wb-words span{flex:1;border-bottom:.35mm dotted var(--soft);height:5.5mm}
  .wb-lines{margin-top:2mm}
  .wb-lines div{border-bottom:.35mm solid var(--line);height:8.5mm}
  .wb-check{display:grid;gap:1.5mm;margin:3mm 0;font-size:9.5pt}
  .wb-check span::before{content:"☐ ";font-size:11pt}
  .wb-sign{margin-top:auto;display:flex;justify-content:space-between;gap:10mm;font-size:9pt;color:var(--soft)}
  .wb-sign i{flex:1;border-top:.35mm solid var(--soft);padding-top:1mm;font-style:normal;text-align:center}
  /* teacher's key */
  .keyu{break-inside:avoid;margin-bottom:4mm;font-size:9pt}
  .rphoto{width:100%;max-width:120mm;height:auto;display:block;margin:0 0 2mm;border-radius:2mm;border:.3mm solid var(--line)}
  .sd-book{display:flex;gap:5mm}
  .sd-book > div{flex:1}
  /* sin recorte: con object-fit:cover se perdian las diferencias
     del cielo y del suelo, que son la mitad del ejercicio */
  .sd-book img{width:100%;height:auto;display:block;
    border:.3mm solid var(--line);border-radius:2mm}
  .keyu h2{font-size:10.5pt;margin:0 0 1mm;color:var(--accent)}
  .keyu p{margin:0 0 .8mm}
  .keyu b{font-weight:700}
  /* SB v2 — estilo Fun: insignias de color, palabras ilustradas, líneas de escritura */
  .sb2-head{background:linear-gradient(180deg,#dceafb,#ffffff);border-radius:6mm;padding:4mm 6mm;display:flex;align-items:center;gap:6mm;margin-bottom:4mm}
  .sb2-head .balloon{width:16mm;height:16mm;border-radius:50%;background:var(--accent);color:#fff;font-family:"Baloo 2";font-weight:800;font-size:20pt;display:flex;align-items:center;justify-content:center;box-shadow:2mm 2mm 0 rgba(0,0,0,.08)}
  .sb2-head h1{font-size:20pt;margin:0;color:var(--accent);flex:1}
  .sb2-head .focus{font-size:7pt;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);text-align:right}
  .op-text{border-left:2mm solid var(--accent);background:var(--band);border-radius:0 3mm 3mm 0;padding:2.5mm 4mm;margin:2.5mm 0;font-size:9.8pt;line-height:1.55}
  .op-text b{font-family:"Baloo 2";color:var(--accent)}
  .picwords{display:flex;flex-wrap:wrap;gap:2mm;margin:3mm 0}
  .picwords .pw{width:24mm;border:.35mm solid var(--line);border-radius:3mm;padding:1.5mm 1mm 1mm;text-align:center}
  .picwords .pw .ico{font-size:24pt;line-height:1.15}
  .picwords .pw .w{font-size:7.5pt;font-weight:700;color:var(--ink)}
  .picwords .pw .ln{border-bottom:.35mm dotted var(--soft);height:4.5mm;margin-top:1mm}
  .abadge{width:7mm;height:7mm;border-radius:50%;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:"Baloo 2";font-weight:800;font-size:10.5pt;flex:none}
  .cA{background:#e8912d}.cB{background:#3f9d63}.cC{background:#3b6fb5}.cD{background:#8a5fb0}.cE{background:#d95f80}.cF{background:#3f9d9d}.cG{background:#b0743f}
  .writelines div{border-bottom:.35mm solid #c9d5e0;height:7.5mm}
  .listenchip{display:inline-flex;align-items:center;gap:1.5mm;background:var(--band);border-radius:10mm;padding:.8mm 3.5mm;font-size:8pt;font-weight:700;color:var(--accent)}
  .persbox{border:.6mm solid #8fc98f;background:#f2f9f2;border-radius:4mm;padding:2.5mm 4mm;margin-top:2.5mm;font-size:9.5pt}
  .persbox b{font-family:"Baloo 2";color:#3f9d63}
  .persbox span{display:inline-block;border-bottom:.35mm dotted var(--soft);min-width:30mm;height:5mm;margin:0 2mm}
  .lsn-lines{display:grid;grid-template-columns:1fr 1fr;gap:1.5mm 8mm;margin-top:2mm;font-size:9.5pt}
  .lsn-lines div{display:flex;gap:2mm;align-items:baseline}
  .lsn-lines span{flex:1;border-bottom:.35mm dotted var(--soft);height:5mm}
  .pagebubble{position:absolute;bottom:5mm;left:16mm;background:var(--band);color:var(--accent);font-family:"Baloo 2";font-weight:800;border-radius:50%;width:9mm;height:9mm;display:flex;align-items:center;justify-content:center}
  .cover{align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#eef3f7,#fff)}
  .cover h1{font-size:34pt;color:var(--accent);margin:4mm 0 0}
  .cover .sub{font-size:13pt;color:var(--soft)}
  .cover img{height:75mm;margin-top:8mm}
  .cover .cast{display:flex;gap:6mm;margin-top:10mm}
  .cover .cast img{height:48mm}
  @page{size:A4;margin:0}
</style>
</head>
<body id="book"></body>
<script src="../engine/crossword-layout.js"></script>
<script src="../engine/emoji-map.js"></script>
<script src="../engine/vocab-art.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const LEVEL = qs.get('level') || 'flyers';
const MODE = qs.get('mode') || 'sb';   // sb | wb | key
const UNITS = qs.get('units') ? qs.get('units').split(',').map(Number) : null; // null = todas
const CHAR = (slug,pose)=>`../assets/characters/${LEVEL}/${slug}/pose-${String(pose).padStart(2,'0')}.png`;
const FB = `onerror="this.onerror=null;this.src=this.src.replace('.png','.svg')"`;
const COLORS = { starters:'#d97d0d', movers:'#2f9268', flyers:'#3b6fb5' };
if (COLORS[LEVEL]) document.documentElement.style.setProperty('--accent', COLORS[LEVEL]);

async function j(p){ const r=await fetch(p); return r.json(); }

function crosswordHTML(data){
  const wordsL = data.words[0].row !== undefined ? data.words : layoutCrossword(data.words);
  let R=0,C=0; const cells={};
  wordsL.forEach(w=>[...w.word].forEach((ch,i)=>{
    const r=w.row+(w.dir==='down'?i:0), c=w.col+(w.dir==='across'?i:0);
    cells[r+','+c]=ch; R=Math.max(R,r+1); C=Math.max(C,c+1); }));
  const starts=[...new Set(wordsL.map(w=>w.row+','+w.col))]
    .sort((a,b)=>{const[ar,ac]=a.split(',').map(Number),[br,bc]=b.split(',').map(Number);return ar-br||ac-bc});
  const num=p=>starts.indexOf(p)+1;
  let g='<table>';
  for(let r=0;r<R;r++){ g+='<tr>';
    for(let c=0;c<C;c++){ const k=r+','+c;
      g+= cells[k]!==undefined ? `<td class="cell">${starts.includes(k)?`<span class="n">${num(k)}</span>`:''}</td>` : '<td></td>'; }
    g+='</tr>'; }
  g+='</table>';
  const list=d=>`<ol>${wordsL.filter(w=>w.dir===d).map(w=>({n:num(w.row+','+w.col),w})).sort((a,b)=>a.n-b.n)
    .map(({n,w})=>`<li value="${n}">${w.clue} <small>(${w.word.length})</small></li>`).join('')}</ol>`;
  return `<div class="xw">${g}<div class="clues"><h3>Across ➜</h3>${list('across')}<h3>Down ⬇</h3>${list('down')}</div></div>`;
}

function matchHTML(data){
  const rights=[...data.pairs.map(p=>p.right), ...(data.extra||[])].sort(()=>Math.random()-.5);
  const rows=Math.max(data.pairs.length, rights.length);
  let cells='';
  for(let i=0;i<rows;i++){
    cells += data.pairs[i]?`<span>${data.pairs[i].left}</span>`:'<span style="border:0"></span>';
    cells += rights[i]!==undefined?`<span>${rights[i]}</span>`:'<span style="border:0"></span>';
  }
  return `${data.extra?'<div style="font-size:8.5pt;color:var(--soft);margin-bottom:1mm"><i>Careful — one answer is extra!</i></div>':''}
    <div class="mt"><span class="colh">${data.left_label||''}</span><span class="colh">${data.right_label||''}</span>${cells}</div>`;
}

function gapTextHTML(data, ud, code){
  // la misma foto que en pantalla, si esa lectura la tiene
  const foto = (ud && code) ? `<img class="rphoto" src="../assets/reading-photos/${ud.level}-${ud.number}-${code}.jpg" alt="" onerror="this.remove()">` : '';
  const text = data.text.replace(/\{(\d+)\}/g, (m,n)=>`<b>(${n})</b> ______________`);
  return `${foto}${data.box?`<div style="border:.35mm solid var(--line);border-radius:3mm;padding:2mm 4mm;margin-bottom:2mm;font-weight:700;font-size:9.5pt">${[...data.box].sort(()=>Math.random()-.5).join(' &nbsp;·&nbsp; ')}</div>`:''}
    <div class="exam"><div class="rtext" style="line-height:2">${text}<p class="credit">Written by Paolo Baca</p></div></div>`;
}

function spotDiffHTML(data, ud){
  // Dos fotos del campus con los objetos de la unidad; si esa unidad aun no
  // las tiene, el onerror deja la rejilla de emoji de siempre.
  const base = ud ? `../assets/spot-diff/${ud.level}-${ud.number}` : '';
  const grid = scene=>`<table style="border-collapse:collapse">${scene.map(row=>`<tr>${row.map(ch=>`<td style="width:9mm;height:9mm;text-align:center;font-size:14pt;border:.3mm solid var(--line)">${ch}</td>`).join('')}</tr>`).join('')}</table>`;
  // las unidades nuevas solo traen las zonas, sin rejilla de emoji
  const emoji = data.sceneA
    ? `<div style="display:flex;gap:8mm"><div><b style="font-family:'Baloo 2'">A</b>${grid(data.sceneA)}</div>
       <div><b style="font-family:'Baloo 2'">B</b>${grid(data.sceneB)}</div></div>`
    : '';
  if (!base) return emoji;
  return `<div style="font-size:9pt;color:var(--soft);margin-bottom:1.5mm"><i>Find and circle the differences in picture B. Then tell your partner: "In A the ball is red, but in B it is blue."</i></div>
    <div class="sd-book" data-fb="${emoji.replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">
      <div><b style="font-family:'Baloo 2'">A</b><img src="${base}-A.jpg" alt=""
           onerror="this.closest('.sd-book').innerHTML=this.closest('.sd-book').dataset.fb"></div>
      <div><b style="font-family:'Baloo 2'">B</b><img src="${base}-B.jpg" alt=""></div>
    </div>`;
}

function examHTML(data){
  return `<div class="exam">${data.text?`<div class="rtext">${data.text}<p class="credit">Written by Paolo Baca</p></div>`:''}
    ${data.items.map((it,i)=>`<div class="item">${i+1}. ${it.sentence.replace('___','______')}<span class="opts">${
      it.options.map(o=>`<span class="opt">${o}</span>`).join('')}</span></div>`).join('')}</div>`;
}

const AB = { crossword: crosswordHTML, match_words: matchHTML, exam_task: examHTML,
             gap_text: gapTextHTML, spot_diff: spotDiffHTML,
             pairwork: d=>`<div class="pair">👥 ${d.text}</div>` };

function sceneFor(ud){
  const t = ((ud.topic||'')+' '+(ud.title||'')+' '+(ud.grammar||'')).toLowerCase();
  const has = (...ws)=>ws.some(w=>t.includes(w));
  // Deporte y movimiento
  if (has('hockey','sport','football','match','team','ball','game of')) return 'hockey';
  if (has('run','athletic','exercise','race','fit','body','face','health','hair','tall','strong')) return 'track';
  // Palabras y letras
  if (has('librar','book','read','stor','writ','letter','spell','alphabet','biograph','diary','note')) return 'library';
  // Aula: lo escolar y la gramatica que no tiene mundo propio
  if (has('school','classroom','lesson','subject','timetable','homework','study','exam','test','practice','teacher','pencil','material')) return 'classroom';
  // Mirador: mar, cielo, clima, mundo
  if (has('beach','sea','ocean','island','boat','fish','swim','sail','geograph','space','sky','star','planet','world','country','weather','season','rain','snow','sunny','cloud','wind','storm')) return 'mirador';
  // Picnic: comida y celebraciones de mesa
  if (has('food','fruit','vegetable','eat','drink','breakfast','lunch','dinner','picnic','meal','snack','cook','hungry','thirst','cake','kitchen')) return 'picnic-garden';
  // Huerto: naturaleza y animales
  if (has('garden','plant','flower','tree','farm','countryside','nature','grow','animal','pet','bird','insect','zoo')) return 'garden';
  // Plaza del ajedrez: numeros, cantidades y comparaciones
  if (has('number','count','math','quantit','compar','superlativ','measure','money','price','how many','how much','more','most','less')) return 'chess-plaza';
  // Fachada: la ciudad, la casa, el trabajo, los viajes
  if (has('town','city','place','building','street','direction','way','map','shop','buy','work','job','travel','transport','holiday','trip','home','house','room','bedroom','furniture','chore','clean','live','clothes','wear')) return 'facade';
  // Entrada: la gente
  if (has('hello','welcome','greet','friend','family','people','person','name','telephone','phone','feel','happy','sad','personal','who')) return 'entrance';
  // Anfiteatro: fiesta, musica y repaso
  if (has('review','party','celebrat','music','show','concert','birthday','danc','sing','hobb','free time','screen')) return 'amphitheater';
  // Laberinto: juego y posicion
  if (has('game','play','toy','prepos','position','where is','behind','between','hide')) return 'labyrinth';
  // Tiempo y rutina
  if (has('time','clock','hour','day','week','month','routine','morning','afternoon','night','often','always','frequen')) return 'campus-hex';
  // Sin tema propio (gramatica pura): se reparte por numero de unidad para
  // que ninguna pagina quede sin ilustracion y no salga siempre la misma.
  const pool = ['campus-hex','chess-plaza','amphitheater','entrance','facade','labyrinth','mirador','classroom'];
  return pool[(Number(ud.number)||0) % pool.length];
}
function makeIntro(ud){
  if (ud.scene && ud.scene.intro) return ud.scene.intro;
  const cap = n => n.charAt(0).toUpperCase()+n.slice(1);
  const c1 = cap(ud.characters[0]||''), c2 = cap(ud.characters[1]||c1);
  if (LEVEL==='starters') return `Hello, explorers! Today ${c1} and ${c2} are playing with the world of ${ud.topic}. Look at the big pictures, say every new word out loud and listen to the story with your best ears. Pip is hiding somewhere in this unit too! When you finish all the games, you win a star. Ready, explorers? One, two, three… let's go!`;
  if (LEVEL==='movers') return `Welcome back, Fjord Club! In this unit, ${c1} and ${c2} discover the world of ${ud.topic}. First learn the picture words, then read carefully and listen to your friends — the answers are always hiding in the story. You will also practise ${ud.grammar}. Luna is watching and she only barks for good answers. The adventure starts now!`;
  return `The Aurora Expedition continues! This time, ${c1} and ${c2} take you deep into the world of ${ud.topic}. Read the texts slowly, listen twice like in the real exam, and use ${ud.grammar} like a true explorer. Every activity you finish takes you one step closer to the Flyers exam — and Kili is carrying a star with your name on it. Good luck, explorer!`;
}
function cover(idx, subtitle){
  return `<div class="page cover">
    <div><span style="font-family:'Baloo 2';font-weight:700;color:var(--soft);letter-spacing:.1em">NORDIC INTERNATIONAL SCHOOL · COHASSET</span>
    <h1>${idx.name.split('·')[0].trim()}</h1><div class="sub">${idx.name.split('·')[1]} · ${subtitle}</div>
    <img class="campus" src="../assets/scenes/facade.jpg" alt=""
         onerror="this.remove()" style="height:52mm;width:150mm;object-fit:cover;border-radius:5mm;margin-top:6mm">
    <img src="${CHAR(idx.mascot,1)}" alt="" ${FB} style="height:46mm;margin-top:4mm">
    <div class="cast">${(idx.kids||[]).map(c=>`<img src="${CHAR(c,1)}" ${FB}>`).join('')}</div></div></div>`;
}

/* EMOJI viene de engine/emoji-map.js */
function picwordsHTML(wordlist){
  const cards = wordlist.slice(0,10).map(w=>{
    const key = w.replace(/^(a|an|the) /,'');
    // el mismo render 3D que en pantalla; vectorial y emoji de respaldo
    const art = (window.VOCAB_ART && VOCAB_ART.get(key)) || null;
    const plano = art || `<span class="emo">${EMOJI[key] || EMOJI[key.toLowerCase()] || '✏️'}</span>`;
    const s3d = key.toLowerCase().replace(/'/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
    const ico = `<img class="art3d" src="../assets/vocab/${s3d}.png" alt=""
                   onerror="this.replaceWith(...new DOMParser().parseFromString(this.dataset.fb,'text/html').body.childNodes)"
                   data-fb="${String(plano).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}">`;
    return `<div class="pw"><div class="ico">${ico}</div><div class="w">${w}</div><div class="ln"></div></div>`;
  }).join('');
  return `<div class="act"><h2><span class="abadge" style="background:var(--accent)">✎</span>Picture words — look, say and copy.</h2>
    <div class="picwords">${cards}</div></div>`;
}
const BADGE = { A:'cA', B:'cB', C:'cC', D:'cD', E:'cE', F:'cF', G:'cG', H:'cA' };
function sbPage(ud, pageno){
  // por letra, no por el orden del JSON: una actividad anadida despues
  // se escribe al final del array y saldria fuera de sitio en el libro
  const acts = ud.activities.filter(a=>a.outputs.includes('book') || a.type === 'listening')
    .slice().sort((x,y)=>(x.code||'').localeCompare(y.code||''));
  const actHTML = acts.map(a=>{
    let body = '';
    if (a.type === 'listening') {
      body = `<span class="listenchip">🎧 Listen online — unit ${ud.number}</span>
        <div class="lsn-lines">${a.data.questions.map((q,i)=>`<div>${i+1}. ${q.q.replace('…','_____')}<span></span></div>`).join('')}</div>`;
    } else {
      body = AB[a.type] ? AB[a.type](a.data, ud, a.code) : '';
      if (a.type === 'exam_task' && !a.data.text) body += `<div class="writelines" style="margin-top:2mm"><div></div></div>`;
    }
    return `<div class="act"><h2><span class="abadge ${BADGE[a.code]||'cA'}">${a.code}</span>${a.title}</h2>${body}</div>`;
  }).join('');
  return `<div class="page">
    <div class="sb2-head"><span class="balloon">${ud.number}</span><h1>${ud.title}</h1>
      <span class="focus">${ud.exam_focus.paper}<br>Part ${ud.exam_focus.part}</span></div>
    <div class="scene">${ud.characters.map(c=>`<img src="${CHAR(c,(ud.scene.pose||{})[c]||1)}" ${FB}>`).join('')}
      <div class="bubble">${ud.scene.bubble}</div></div>
    <div class="op-text"><b>📖 The story of this unit:</b> ${makeIntro(ud)}</div>
    ${(()=>{
      const sc = sceneFor(ud);
      const respaldo = sc ? `../assets/scenes/${sc}.jpg` : '';
      return `<img class="op-art" alt=""
                src="../assets/unit-scenes/${ud.level}-${ud.number}.jpg"
                onerror="this.onerror=null;${respaldo ? `this.src='${respaldo}'` : `this.remove()`}">`;
    })()}
    ${picwordsHTML(ud.wordlist)}
    ${actHTML}
    <div class="persbox"><b>All about me:</b> my two favourite words of this unit are <span></span> and <span></span>.</div>
    <div class="wordlist"><b>Wordlist:</b> ${ud.wordlist.join(' · ')} &nbsp;·&nbsp; <b>Grammar:</b> ${ud.grammar}</div>
    <span class="pagebubble">${pageno}</span></div>`;
}

function wbPage(ud, pageno){
  const hw = (ud.homework && ud.homework[0]) ? ud.homework[0].prompt : '';
  return `<div class="page">
    <div class="band"><span class="n">${ud.number}</span><h1>${ud.title} · Homework</h1>
      <span class="focus">Fun for Nordic<br>Workbook</span></div>
    <div class="act"><h2><span class="code">1</span>My words — copy each word carefully.</h2>
      <div class="wb-words">${ud.wordlist.slice(0,10).map(w=>`<div><b>${w}</b><span></span></div>`).join('')}</div></div>
    <div class="act"><h2><span class="code">2</span>Homework task</h2>
      <div class="pair">${hw}</div>
      <div class="wb-lines">${'<div></div>'.repeat(7)}</div></div>
    <div class="act"><h2><span class="code">3</span>Check yourself</h2>
      <div class="wb-check">
        <span>I know the words of <b>${ud.topic}</b>.</span>
        <span>I can use: <b>${ud.grammar}</b>.</span>
        <span>I finished my homework and checked the spelling.</span>
      </div></div>
    <div class="wb-sign"><i>Student's signature</i><i>Family signature</i><i>Teacher's ✓</i></div>
    <span class="pageno">${pageno}</span></div>`;
}

function keyUnit(ud, zonas){
  const parts = [];
  // Cada rama toca datos distintos y basta con que a una actividad le falte
  // un campo para que reviente la Key entera y salga solo la portada, que
  // es justo lo que pasaba con las diferencias. Por eso va protegido: si
  // una actividad no trae respuestas, se dice y se sigue.
  const d = a => (a && a.data) || {};
  for (const a of ud.activities){
    let linea = '';
    try {
      if (a.type === 'crossword' && d(a).words) {
        linea = d(a).words.map(w=>w.word).join(', ');
      } else if (a.type === 'match_words' && d(a).pairs) {
        linea = d(a).pairs.map(p=>`${p.left} → ${p.right}`).join(' · ');
      } else if (a.type === 'listening' && d(a).questions) {
        linea = '(listening) ' + d(a).questions.map((q,i)=>`${i+1}. ${q.answer}`).join('  ');
      } else if (a.type === 'exam_task' && d(a).items) {
        linea = d(a).items.map((it,i)=>`${i+1}. ${it.options[it.answer]}`).join('  ');
      } else if (a.type === 'gap_text' && d(a).answers) {
        linea = '(gap text) ' + d(a).answers.map((x,i)=>`${i+1}. ${x}`).join('  ');
      } else if (a.type === 'spot_diff') {
        if (d(a).diffs) {
          linea = '(differences) ' + d(a).diffs.map(([r,c])=>`row ${r+1}, col ${c+1}`).join(' · ');
        } else {
          // las unidades nuevas guardan las zonas aparte, en el archivo de
          // la escena: al profesor le sirve saber cuantas hay y donde caen
          const z = (zonas && zonas[ud.number]) || [];
          linea = z.length
            ? `(differences) ${z.length} in picture B: ` + z.map((q,i)=>
                `${i+1}. ${Math.round(q.x*100)}% across, ${Math.round(q.y*100)}% down`).join(' · ')
            : '(differences) see picture B';
        }
      }
    } catch (e) { linea = ''; }
    if (linea) parts.push(`<p><b>${a.code}</b> · ${linea}</p>`);
  }
  return `<div class="keyu"><h2>Unit ${ud.number} · ${ud.title}</h2>${parts.join('')}</div>`;
}

async function build(){
  const idx = await j(`../content/${LEVEL}/index.json`);
  const book = document.getElementById('book');
  const subtitle = MODE === 'wb' ? "Workbook" : MODE === 'key' ? "Teacher's Key" : "Student's Book";
  book.innerHTML = cover(idx, subtitle);
  const uds = [];
  const list = UNITS || idx.units.map(u=>u.n);
  for(const n of list) uds.push(await j(`../content/${LEVEL}/unit-${String(n).padStart(2,'0')}.json`));
  let pageno = 1;
  if (MODE === 'key') {
    // las zonas de las diferencias viven junto a la escena, no en la unidad
    const zonas = {};
    await Promise.all(uds.map(async ud => {
      try {
        const r = await fetch(`../assets/spot-diff/${LEVEL}-${ud.number}-diffs.json`);
        if (r.ok) zonas[ud.number] = (await r.json()).zonas || [];
      } catch (e) {}
    }));
    // fluye en columnas de página con break-inside:avoid por unidad
    book.insertAdjacentHTML('beforeend',
      `<div class="page"><div class="band"><h1>${idx.name} — Teacher's Key</h1></div>
       <div style="margin-top:4mm">${uds.map(ud => keyUnit(ud, zonas)).join('')}</div></div>`);
  } else {
    for(const ud of uds)
      book.insertAdjacentHTML('beforeend', MODE === 'wb' ? wbPage(ud, pageno++) : sbPage(ud, pageno++));
  }
  document.title = 'READY';
}
build();
</script>
</html>
